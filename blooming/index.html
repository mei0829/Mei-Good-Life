<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="幸孕女子">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>幸孕女子</title>
<script>
  // 先套用上次選的顏色主題，打開時才不會閃一下預設顏色
  try { var t = JSON.parse(localStorage.getItem('bd-theme') || 'null'); if (t && t.c) { var r = document.documentElement; for (var k in t.c) r.style.setProperty('--color-' + k, t.c[k]); r.style.colorScheme = t.dark ? 'dark' : 'light'; if (t.dark) { r.style.setProperty('--noise', 'transparent'); r.style.setProperty('--backdrop', 'rgba(0,0,0,.55)'); } document.querySelector('meta[name="theme-color"]').setAttribute('content', t.c.ivory); } } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- 標題與數字用圓體 jf 粉圓（Huninn），內文用 Noto Sans TC；品牌名稱「幸孕女子」用霞鶩文楷 -->
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
