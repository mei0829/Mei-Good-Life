<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業成績">
<link rel="manifest" href="school.webmanifest">
<link rel="icon" href="school.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="school.svg">
<title>作業與成績</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#2B2A27;--sub:#737780;--line:#DDE2EA;--acc:#4F6F8C;--on:#fff;--ok:#3F8A5F;--bad:#C94A4A;--warn:#B7791F;--soft:#E1E7EF;--oks:#E2F0E7;--bads:#F7E1E1;--warns:#F7ECD9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171A;--card:#202328;--ink:#EDEAE4;--sub:#A0A4AC;--line:#30343B;--acc:#8DB0D0;--on:#15171A;--ok:#7CC49A;--bad:#F07070;--warn:#E3B062;--soft:#29303A;--oks:#22342A;--bads:#3A2526;--warns:#3A3020}}
:root[data-theme="dark"]{--bg:#15171A;--card:#202328;--ink:#EDEAE4;--sub:#A0A4AC;--line:#30343B;--acc:#8DB0D0;--on:#15171A;--ok:#7CC49A;--bad:#F07070;--warn:#E3B062;--soft:#29303A;--oks:#22342A;--bads:#3A2526;--warns:#3A3020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC",-apple-system,"Microsoft JhengHei",sans-serif}
#app{max-width:980px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 90px}
#app::after{content:"© 2026 mei0829 版權所有";display:block;text-align:center;font-size:11px;color:var(--sub);margin-top:28px;opacity:.8}
h1{font-size:24px;margin:4px 0 0;font-weight:700}
h2{font-size:14px;margin:18px 2px 8px;color:var(--sub);font-weight:500;display:flex;justify-content:space-between;gap:8px}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
input,select,textarea{font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}
.sub{font-size:13px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.go{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:10px 16px;font-weight:700}
.bt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
#authwrap{max-width:420px;margin:0 auto;padding:40px 16px}#authwrap a{color:var(--acc)}
.afl{display:block;margin-bottom:10px}.afl span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.top .row{flex-wrap:nowrap}
.home{font-size:14px;text-decoration:none}
#st{font-size:12px;color:var(--sub);margin:2px 0 10px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:10px}
.tabs button{border:0;background:none;border-radius:10px;padding:7px 4px;font-weight:500;color:var(--sub);position:relative}
.tabs button.on{background:var(--acc);color:var(--on)}
.tabs i{font-style:normal;font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:1px}
.bar{display:flex;gap:8px}.bar input{flex:1;border-radius:14px;height:42px}.bar .go{flex:none;border-radius:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
#kids{padding:0 0 10px}
#kids button{font-size:14px;padding:5px 14px}
#kids button.on{background:var(--kc,var(--acc));border-color:var(--kc,var(--acc))}

.it{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.it.dn{opacity:.62}
.it .bd{flex:1;min-width:0}
.it .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.it b{font-size:16px;overflow-wrap:anywhere;font-weight:500}
.it .ln{font-size:13px;color:var(--sub);margin-top:3px;overflow-wrap:anywhere}
.ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;font-weight:700;color:var(--on);padding:0;margin-top:1px}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.fx{border-color:var(--warn);color:var(--warn);font-size:14px}
.sc{flex:none;min-width:52px;text-align:center;font-size:22px;font-weight:700;line-height:1.1;padding-top:2px}
.sc small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--acc);margin-right:4px;font-weight:500;white-space:nowrap}
.tag.g{background:none;border:1px solid var(--line);color:var(--sub)}
.tag.ok{background:var(--oks);color:var(--ok)}.tag.bad{background:var(--bads);color:var(--bad)}.tag.warn{background:var(--warns);color:var(--warn)}
.kt{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin-right:4px;color:#fff;background:var(--c);font-weight:500;white-space:nowrap}
.empty{text-align:center;padding:28px 12px;color:var(--sub)}
.gone{text-align:center;padding:40px 16px}
.sumr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:10px}
.sumr div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 4px}
.sumr b{display:block;font-size:20px}.sumr span{font-size:12px;color:var(--sub)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px}
.sbx{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left}
.sbx.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.sbx .n{font-size:13px;color:var(--sub);display:flex;justify-content:space-between}
.sbx b{font-size:22px;display:block;line-height:1.3}
.sbx .m{font-size:12px;color:var(--sub)}
.fxl{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.fxb{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:6px 0}
.fxb i{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--on)}
.fxb.on i{background:var(--ok);border-color:var(--ok)}
.fxb.on span{text-decoration:line-through;color:var(--sub)}

#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.35)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 12px;font-size:18px}
#sheet .back{position:sticky;top:-16px;z-index:2;margin:-16px -16px 6px;padding:12px 16px 6px;background:var(--bg)}
#sheet .back button{border:0;background:none;color:var(--acc);font-size:16px;font-weight:500;padding:4px 0}
.f{display:block;margin-bottom:12px}.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px}
.pick button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 2px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--acc);color:var(--on);font-weight:500}
.seg.s5{grid-template-columns:repeat(5,1fr)}
.tg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:12px}
.tg i{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;color:var(--on);font-size:13px}
.tg.on i{background:var(--ok);border-color:var(--ok)}
.li{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:6px}
.li>span{flex:1;min-width:0;overflow-wrap:anywhere}.li small{display:block;color:var(--sub);font-size:12px}
.li>button{border:0;background:none;padding:6px 8px;color:var(--sub)}
.li input{flex:1}
.li input.n{width:90px;flex:none;text-align:right}
.li .cb{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);padding:0;display:grid;place-items:center;color:var(--on);font-size:13px}
.li .cb.on{background:var(--ok);border-color:var(--ok)}
.li .cb.on+span{text-decoration:line-through;color:var(--sub)}
.add{display:flex;gap:8px;margin:8px 0 4px}.add input{flex:1}.add button{flex:none}
.quick{display:flex;gap:6px;margin-top:6px}.quick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13px}
.log{font-size:12.5px;color:var(--sub);border-top:1px solid var(--line);padding:5px 0}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 14px;font-size:14px;display:none;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.on{display:flex}
#toast button{border:0;background:none;color:var(--acc);font-weight:700;padding:0;white-space:nowrap}

/* 電腦：清單排成兩欄，視窗放在畫面中間 */
@media (min-width:820px){
 .grp{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
 .grp>.it,.grp>.card{margin-bottom:10px}
 #sheet .pn{top:50%;bottom:auto;transform:translateY(-50%);border-radius:20px;max-height:86vh;padding-bottom:18px}
 #sheet .back{top:-16px}
}
</style>
</head>
<body>
<div id="auth" data-title="作業與成績"></div>
<div id="app"></div><div id="sheet"></div><div id="toast"></div>
<input type="file" id="impf" accept="application/json,.json" style="display:none">
<script type="module" src="auth.js"></script>
<script type="text/plain" id="app-src">
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const nid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const KEY='sch-v1',KT='sch-t';
// 作業狀態：還沒做完 → 交了 → 老師發回來要訂正 → 訂正好了
const HST=['未完成','已繳交','要訂正','訂正完成'];
const ETY=['小考','週考','段考','模擬考','其他'];
const DEF_SUBS=['國語','數學','英語','自然','社會','其他'];
const KCOL=['#4F6F8C','#A8625F','#5E7A6A','#9A7440','#76619A','#A85A30','#3F7F86','#8A5A7A'];

// ---------- 日期 ----------
const z=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const today=()=>ymd(new Date());
const DT=/^\d{4}-\d{2}-\d{2}$/;
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const WK='日一二三四五六';
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+WK[d.getDay()]+'）'};
const dayN=s=>Math.round((pd(s)-pd(today()))/864e5);
const dl=s=>{if(!s)return '';const n=dayN(s);return n===0?'今天':n===1?'明天':n===2?'後天':n===-1?'昨天':md(s)};
const weekStart=()=>{const d=pd(today()),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)};  // 星期一
const fmt=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+z(d.getHours())+':'+z(d.getMinutes())};
const who=e=>e?String(e).split('@')[0]:'';

// ---------- 資料 ----------
const seed=()=>({kids:[],subs:DEF_SUBS.slice(),hw:[],ex:[]});
const arr=a=>Array.isArray(a)?a:[];
const fixes=a=>arr(a).filter(f=>f&&f.x).map(f=>({id:f.id||nid(),x:String(f.x),done:!!f.done}));
const logs=a=>arr(a).filter(l=>l&&l.x).map(l=>({t:+l.t||Date.now(),by:l.by||'',x:String(l.x)})).slice(-40);
const numOr=v=>v===''||v==null||isNaN(+v)?'':+v;
function fix(o){
 if(!o||typeof o!=='object'||!Array.isArray(o.kids))throw new Error('bad');
 o.kids=o.kids.filter(k=>k&&k.name).map((k,i)=>({id:k.id||nid(),name:String(k.name),grade:k.grade||'',c:KCOL.includes(k.c)?k.c:KCOL[i%KCOL.length]}));
 o.subs=[...new Set(arr(o.subs).map(s=>String(s).trim()).filter(Boolean))];if(!o.subs.length)o.subs=DEF_SUBS.slice();
 const ks=new Set(o.kids.map(k=>k.id));
 o.hw=arr(o.hw).filter(h=>h&&h.title&&ks.has(h.kid)).map(h=>({id:h.id||nid(),kid:h.kid,sub:String(h.sub||'其他'),title:String(h.title),due:DT.test(h.due)?h.due:'',
  st:HST.includes(h.st)?h.st:'未完成',chk:!!h.chk,fixes:fixes(h.fixes),note:h.note||'',log:logs(h.log),by:h.by||'',t:+h.t||Date.now(),u:+h.u||Date.now()}));
 o.ex=arr(o.ex).filter(e=>e&&ks.has(e.kid)).map(e=>({id:e.id||nid(),kid:e.kid,sub:String(e.sub||'其他'),type:ETY.includes(e.type)?e.type:'其他',name:String(e.name||''),
  d:DT.test(e.d)?e.d:today(),score:numOr(e.score),full:+e.full>0?+e.full:100,fixes:fixes(e.fixes),note:e.note||'',by:e.by||'',t:+e.t||Date.now(),u:+e.u||Date.now()}));
 return o;
}
let S=null,T=0;
try{S=fix(JSON.parse(localStorage.getItem(KEY)));T=+localStorage.getItem(KT)||0}catch(e){S=null}
if(!S){S=fix(seed());T=0}
let TAB='todo',KID='all';
try{TAB=localStorage.getItem('sch-tab')||'todo';KID=localStorage.getItem('sch-kid')||'all'}catch(e){}
let FIL={hw:'進行中',ex:'全部',fix:'待訂正'};

const kid=id=>S.kids.find(k=>k.id===id);
const multi=()=>S.kids.length>1;
const kname=id=>{const k=kid(id);return k?k.name:'?'};
const kTag=id=>multi()&&KID==='all'?`<span class="kt" style="--c:${(kid(id)||{}).c||'#888'}">${E(kname(id))}</span>`:'';
const mine=o=>KID==='all'||o.kid===KID;
const pend=o=>o.fixes.filter(f=>!f.done).length;
const late=h=>h.st==='未完成'&&h.due&&h.due<today();
const hwNeed=h=>h.st==='要訂正';
const exNeed=e=>pend(e)>0;
const pctOf=e=>e.score===''?null:e.score/e.full*100;
const r1=n=>Math.round(n*10)/10;
const num=n=>String(r1(n));
const scCls=p=>p==null?'':p>=90?'ok':p<60?'bad':'';
const has=(q,...s)=>s.some(x=>String(x||'').toLowerCase().includes(q));
const hwHit=(h,q)=>!q||has(q,h.title,h.sub,h.note,kname(h.kid),...h.fixes.map(f=>f.x));
const exHit=(e,q)=>!q||has(q,e.name,e.sub,e.type,e.note,kname(e.kid),...e.fixes.map(f=>f.x));
const byDue=(a,b)=>(a.due||'9')<(b.due||'9')?-1:(a.due||'9')>(b.due||'9')?1:a.t-b.t;

// ---------- 儲存：先存手機，再同步到共用空間（家人改了會即時更新）----------
const CL={F:null,fam:null,fams:[],ref:null,unsub:null,tm:0,busy:false,again:false,dirty:false,pending:null,st:'',none:false};
const me=()=>CL.F?CL.F.email:'';
function status(t){
 CL.st=t;const s=$('st');if(!s)return;
 const hw=S.hw.filter(mine),a=hw.filter(h=>h.st==='未完成').length,f=hw.filter(hwNeed).length+S.ex.filter(mine).filter(exNeed).length;
 s.textContent=(CL.fam?CL.fam.name+' · ':'')+(S.kids.length?S.kids.length+' 位學生 · 未完成 '+a+' · 要訂正 '+f+' · ':'')+t;
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KT,String(T))}catch(e){}}
function commit(){T=Date.now();saveLocal();render();CL.dirty=true;status('同步中…');clearTimeout(CL.tm);CL.tm=setTimeout(cloudPush,700)}
async function cloudPush(){
 if(!CL.ref){status(CL.st.startsWith('⚠︎')?CL.st:'⚠︎ 沒有連到雲端，資料只存在這支手機');return}
 if(CL.busy){CL.again=true;return}
 CL.busy=true;CL.dirty=false;
 try{await CL.ref.set({j:JSON.stringify(S),t:T,by:me()});status('✓ 已同步')}
 catch(e){CL.dirty=true;status('⚠︎ 還沒同步，變更先存在這支手機，連上網路會再試')}
 CL.busy=false;
 if(CL.again){CL.again=false;cloudPush()}
}
const busyUI=()=>$('sheet').classList.contains('on');
function onCloud(d){
 if(!d){if(!T)T=Date.now();CL.dirty=true;return cloudPush()}
 const ct=+d.t||0;
 if(ct>T){
  if(CL.dirty||CL.busy)return;
  if(busyUI()){CL.pending=d;return}  // 正在編輯：關掉視窗後再更新
  try{S=fix(JSON.parse(d.j))}catch(e){return}
  T=ct;saveLocal();render();
  if(d.by&&d.by!==me())toast(who(d.by)+' 剛剛更新了資料');
 }else if(ct<T&&!CL.busy){CL.dirty=true;return cloudPush()}
 if(!CL.dirty)status('✓ 已同步');
}
function applyPending(){if(CL.pending&&!busyUI()){const d=CL.pending;CL.pending=null;onCloud(d)}}
function useFam(f){
 let prev='';try{prev=localStorage.getItem('sch-fid')||''}catch(e){}
 if(prev&&prev!==f.id){S=fix(seed());T=0;CL.dirty=false;KID='all';saveLocal()}  // 換到別的空間：以那邊的資料為準
 try{localStorage.setItem('sch-fid',f.id);localStorage.setItem('mgl-school','1')}catch(e){}
 if(!CL.fams.some(x=>x.id===f.id))CL.fams.push(f);
 CL.fam=f;CL.none=false;CL.ref=CL.F.doc(f.id,'school');
 if(CL.unsub)CL.unsub();
 status('連線中…');render();
 CL.unsub=CL.ref.watch(onCloud,()=>status('⚠︎ 無法連線，先顯示這支手機上的資料'));
}
async function cloudInit(){
 try{
  const F=CL.F=await claude.use('family');
  if(!F)return status('⚠︎ 沒有連到雲端（請重新登入），資料只存在這支手機');
  try{CL.fams=(await F.list()).filter(x=>x.kind==='school')}catch(e){return status(e&&e.code==='permission-denied'?'⚠︎ 共用空間還沒開通（Firebase 要加上規則），資料先存在這支手機':'⚠︎ 無法連線，先顯示這支手機上的資料')}
  let pick='';try{pick=localStorage.getItem('sch-fid')||''}catch(e){}

function stTag(h){
 if(late(h))return '<span class="tag bad">逾期</span>';
 if(h.st==='未完成')return '<span class="tag g">未完成</span>';
 if(h.st==='要訂正')return '<span class="tag warn">要訂正</span>';

}
function hwRow(h){
 const dn=h.st==='已繳交'||h.st==='訂正完成',od=late(h),n=h.fixes.length,p=pend(h);
 const ck=h.st==='要訂正'?`<button class="ck fx" data-a="hw" data-id="${h.id}" aria-label="看要訂正的地方">✎</button>`:`<button class="ck${dn?' on':''}" data-a="hdone" data-id="${h.id}" aria-label="${dn?'改回':'標記已繳交'}">${dn?'✓':''}</button>`;
 return `<div class="it${dn?' dn':''}" data-a="hw" data-id="${h.id}" role="button" tabindex="0">${ck}<div class="bd"><div class="hd"><b>${E(h.title)}</b>${stTag(h)}</div>
  <div class="ln">${kTag(h.kid)}<span class="tag g">${E(h.sub)}</span>${h.due?`<span class="${od?'bad':''}">${dl(h.due)}交</span>`:'沒有繳交日'}${h.chk?' · ✍️ 已檢查':''}${n?` · 訂正 ${n-p}/${n}`:''}${h.note?' · 📝':''}</div></div></div>`;
}
function exRow(e){
 const p=pend(e),n=e.fixes.length,pc=pctOf(e);
 return `<div class="it" data-a="ex" data-id="${e.id}" role="button" tabindex="0"><div class="sc ${scCls(pc)}">${e.score===''?'—':num(e.score)}${e.full!==100?'<small>/ '+num(e.full)+'</small>':''}</div>
  <div class="bd"><div class="hd"><b>${E(e.name||e.sub+e.type)}</b>${n?(p?`<span class="tag warn">訂正 ${n-p}/${n}</span>`:'<span class="tag ok">訂正完成</span>'):''}</div>
  <div class="ln">${kTag(e.kid)}<span class="tag g">${E(e.sub)}</span>${E(e.type)} · ${dl(e.d)}${e.note?' · 📝':''}</div></div></div>`;
}
const grp=(title,items,extra)=>items.length?`<h2><span>${title}</span>${extra||''}</h2><div class="grp">${items.join('')}</div>`:'';

// 待辦：逾期、今天、明天要交的作業，還沒訂正的，最近的考試
function todoView(q){
 const t=today(),hw=S.hw.filter(mine).filter(h=>hwHit(h,q)),ex=S.ex.filter(mine).filter(e=>exHit(e,q));
 const open=hw.filter(h=>h.st==='未完成').sort(byDue);
 const lt=open.filter(late),d0=open.filter(h=>h.due===t),d1=open.filter(h=>h.due===addD(t,1));
 const soon=open.filter(h=>h.due>addD(t,1)&&h.due<=addD(t,7)),later=open.filter(h=>h.due>addD(t,7)),nod=open.filter(h=>!h.due);
 const fx=[...hw.filter(hwNeed).map(hwRow),...ex.filter(exNeed).sort((a,b)=>a.d<b.d?1:-1).map(exRow)];
 const ws=weekStart(),wDone=S.hw.filter(mine).filter(h=>h.st!=='未完成'&&h.due>=ws&&h.due<=addD(ws,6)).length;
 const rec=ex.filter(e=>e.d>=addD(t,-7)).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.t-a.t);
 let h=`<div class="sumr"><div><b class="${lt.length?'bad':''}">${S.hw.filter(mine).filter(late).length}</b><span>逾期</span></div><div><b>${S.hw.filter(mine).filter(h=>h.st==='未完成').length}</b><span>未完成</span></div><div><b class="${fx.length?'warn':''}">${S.hw.filter(mine).filter(hwNeed).length+S.ex.filter(mine).filter(exNeed).length}</b><span>要訂正</span></div><div><b class="ok">${wDone}</b><span>本週已交</span></div></div>`;
 const body=grp('⚠︎ 逾期還沒交',lt.map(hwRow))+grp('今天要交',d0.map(hwRow))+grp('明天要交',d1.map(hwRow))+grp('要訂正',fx)
  +grp('這週之後要交',soon.map(hwRow))+grp('更久以後',later.map(hwRow))+grp('沒有繳交日',nod.map(hwRow))+grp('最近 7 天的成績',rec.map(exRow));
 h+=body||`<div class="empty">${q?'找不到「'+E(q)+'」':'目前沒有待辦，好棒 🎉<br>有新的作業或考試，按「＋ 新增」記下來'}</div>`;
 h+=`<div style="text-align:center;margin-top:16px"><button class="bt" data-a="week">📋 複製本週摘要（貼到 LINE）</button></div>`;
 return h;
}
function hwView(q){
 const f=FIL.hw;
 let hs=S.hw.filter(mine).filter(h=>hwHit(h,q)&&(f==='全部'||(f==='進行中'?h.st==='未完成'||h.st==='要訂正':f==='已完成'?h.st==='已繳交'||h.st==='訂正完成':h.st===f)));
 if(!hs.length)return `<div class="empty">${q?'找不到「'+E(q)+'」':f==='進行中'?'沒有進行中的作業 🎉':'沒有作業'}</div>`;
 const doneish=f==='已完成'||f==='全部';
 hs.sort(doneish?(a,b)=>-byDue(a,b):byDue);
 const keys=[...new Set(hs.map(h=>h.due))];
 return keys.map(k=>grp(k?dl(k)+(dayN(k)>=-1&&dayN(k)<=2?' · '+md(k):'')+'交':'沒有繳交日',hs.filter(h=>h.due===k).map(hwRow))).join('');
}
// 成績：每科平均、最近一次、跟上一次比
function subStats(es){
 const v=es.filter(e=>e.score!=='').sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.t-b.t);
 if(!v.length)return null;
 const ps=v.map(pctOf),last=ps[ps.length-1],prev=ps.length>1?ps[ps.length-2]:null;
 return {n:v.length,avg:ps.reduce((a,b)=>a+b,0)/ps.length,last,dlt:prev==null?null:last-prev,hi:Math.max(...ps),lo:Math.min(...ps)};
}
function statsBox(es){
 const subs=[...new Set(es.map(e=>e.sub))].sort((a,b)=>S.subs.indexOf(a)-S.subs.indexOf(b));
 return '<div class="subs">'+subs.map(s=>{
  const st=subStats(es.filter(e=>e.sub===s));if(!st)return '';
  const d=st.dlt;
  return `<button class="sbx${FIL.ex===s?' on':''}" data-a="fil" data-v="${E(s)}"><div class="n"><span>${E(s)}</span><span>${st.n} 次</span></div><b class="${scCls(st.avg)}">${num(st.avg)}</b>
   <div class="m">最近 ${num(st.last)}${d==null||Math.abs(d)<.05?'':d>0?' <span class="ok">▲'+num(d)+'</span>':' <span class="bad">▼'+num(-d)+'</span>'} · 最高 ${num(st.hi)}</div></button>`;
 }).join('')+'</div>';
}
function exView(q){
 const f=FIL.ex,all=S.ex.filter(mine).filter(e=>exHit(e,q));
 if(!all.length)return `<div class="empty">${q?'找不到「'+E(q)+'」':'還沒有成績，考完試按「＋ 成績」記下來'}</div>`;
 let h='<h2><span>各科平均（換算成 100 分）</span></h2>';
 if(KID==='all'&&multi())S.kids.forEach(k=>{const es=all.filter(e=>e.kid===k.id);if(es.length)h+=`<div class="sub" style="margin:8px 2px 6px"><span class="kt" style="--c:${k.c}">${E(k.name)}</span></div>`+statsBox(es)});
 else h+=statsBox(all);
 const es=all.filter(e=>f==='全部'||e.sub===f).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.t-a.t);
 const months=[...new Set(es.map(e=>e.d.slice(0,7)))];
 return h+months.map(m=>grp(+m.slice(0,4)+' 年 '+(+m.slice(5))+' 月',es.filter(e=>e.d.slice(0,7)===m).map(exRow))).join('');
}
// 訂正：每一項要訂正的地方都可以直接打勾
function fixCard(o,k){
 const isH=k==='h',n=o.fixes.length,p=pend(o);
 const head=isH?`<b>${E(o.title)}</b>`:`<b>${E(o.name||o.sub+o.type)}</b> <span class="${scCls(pctOf(o))}" style="font-weight:700">${o.score===''?'':num(o.score)+(o.full!==100?'/'+num(o.full):'')+' 分'}</span>`;
 const done=isH?o.st==='訂正完成':!p;
 return `<div class="card"><div data-a="${isH?'hw':'ex'}" data-id="${o.id}" role="button" tabindex="0" style="cursor:pointer"><div class="row" style="justify-content:space-between"><span>${head}</span>${done?'<span class="tag ok">訂正完成</span>':`<span class="tag warn">${n?'還剩 '+p+' 項':'要訂正'}</span>`}</div>
  <div class="sub" style="margin-top:2px">${kTag(o.kid)}<span class="tag g">${E(o.sub)}</span>${isH?'作業'+(o.due?' · '+dl(o.due)+'交':''):E(o.type)+' · '+dl(o.d)}</div></div>
  ${n?`<div class="fxl">${o.fixes.map(f=>`<button class="fxb${f.done?' on':''}" data-a="fx" data-k="${k}" data-id="${o.id}" data-f="${f.id}"><i>${f.done?'✓':''}</i><span>${E(f.x)}</span></button>`).join('')}</div>`
   :isH&&!done?`<div class="fxl row" style="justify-content:space-between"><span class="sub">沒有列出要訂正哪裡</span><button class="bt" data-a="hfix" data-id="${o.id}">✓ 訂正好了</button></div>`:''}</div>`;
}
function fixView(q){
 const wantDone=FIL.fix==='已訂正';
 const hs=S.hw.filter(mine).filter(h=>hwHit(h,q)&&(wantDone?h.st==='訂正完成':hwNeed(h))).map(h=>({o:h,k:'h',d:h.due||ymd(new Date(h.t)),u:h.u}));
 const es=S.ex.filter(mine).filter(e=>exHit(e,q)&&e.fixes.length&&(wantDone?!pend(e):pend(e))).map(e=>({o:e,k:'e',d:e.d,u:e.u}));
 const all=[...hs,...es].sort(wantDone?(a,b)=>b.u-a.u:(a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
 if(!all.length)return `<div class="empty">${q?'找不到「'+E(q)+'」':wantDone?'還沒有訂正完成的紀錄':'沒有要訂正的 🎉<br>作業被老師發回來要訂正，把狀態改成「要訂正」；<br>考卷的錯題記在成績裡，就會出現在這裡'}</div>`;
 return '<div style="height:8px"></div><div class="grp">'+(wantDone?all.slice(0,60):all).map(x=>fixCard(x.o,x.k)).join('')+'</div>';

// 本週摘要：貼到 LINE 給家人或老師
function weekText(){
 const ws=weekStart(),we=addD(ws,6),t=today();
 const ks=KID==='all'?S.kids:[kid(KID)];
 return ks.map(k=>{
  const hw=S.hw.filter(h=>h.kid===k.id),wk=hw.filter(h=>h.due>=ws&&h.due<=we);
  const lt=hw.filter(late),fx=hw.filter(hwNeed),efx=S.ex.filter(e=>e.kid===k.id&&exNeed(e));
  const ex=S.ex.filter(e=>e.kid===k.id&&e.d>=ws&&e.d<=we&&e.score!=='').sort((a,b)=>a.d<b.d?-1:1);
  const L=[`【${k.name}・本週學習摘要】${md(ws)}–${md(we)}`];
  L.push(`作業：這週要交 ${wk.length} 項，已交 ${wk.filter(h=>h.st!=='未完成').length} 項`+(lt.length?`，逾期 ${lt.length} 項`:''));
  lt.forEach(h=>L.push(`・逾期：${h.sub} ${h.title}（${md(h.due)}）`));
  const op_=hw.filter(h=>h.st==='未完成'&&!late(h)&&h.due&&h.due<=addD(t,3));
  op_.forEach(h=>L.push(`・${dl(h.due)}要交：${h.sub} ${h.title}`));
  if(fx.length||efx.length){L.push(`要訂正：${fx.length+efx.length} 項`);fx.forEach(h=>L.push(`・${h.sub} ${h.title}${h.fixes.length?`（剩 ${pend(h)} 項）`:''}`));efx.forEach(e=>L.push(`・${e.sub}${e.type}${e.name?' '+e.name:''}（剩 ${pend(e)} 題）`))}
  else L.push('要訂正：沒有 👍');
  if(ex.length){L.push('成績：');ex.forEach(e=>L.push(`・${md(e.d)} ${e.sub}${e.type}${e.name?' '+e.name:''}：${num(e.score)}${e.full!==100?' / '+num(e.full):''} 分`))}
  return L.join('\n');
 }).join('\n\n');
}

function toggleFix(k,id,fid){
 const list=k==='h'?S.hw:S.ex,o=list.find(x=>x.id===id);if(!o)return;

 });

  p.querySelector('#cx').onclick=()=>{
   const rows=[['學生','科目','類型','名稱','日期','分數','滿分','換算百分','錯題數','還沒訂正','備註']];
   S.ex.slice().sort((a,b)=>a.d<b.d?-1:1).forEach(e=>rows.push([kname(e.kid),e.sub,e.type,e.name,e.d,e.score,e.full,e.score===''?'':r1(pctOf(e)),e.fixes.length,pend(e),e.note]));
   download('成績表-'+stamp()+'.csv',csv(rows),'text/csv');
  };
  p.querySelector('#ch').onclick=()=>{
   const rows=[['學生','科目','作業','繳交日','狀態','已檢查','要訂正項目','還沒訂正','備註']];
   S.hw.slice().sort(byDue).forEach(h=>rows.push([kname(h.kid),h.sub,h.title,h.due,late(h)?'逾期':h.st,h.chk?'是':'',h.fixes.map(f=>(f.done?'✓':'')+f.x).join('、'),pend(h),h.note]));
   download('作業紀錄-'+stamp()+'.csv',csv(rows),'text/csv');
  };
  p.querySelector('#exp').onclick=()=>download('作業與成績-'+stamp()+'.json',JSON.stringify(S,null,1),'application/json');
  p.querySelector('#imp').onclick=()=>$('impf').click();
  const lo=p.querySelector('#lo');if(lo)lo.onclick=()=>window.fbLogout();
 });
}
$('impf').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 let o;try{o=fix(JSON.parse(await f.text()))}catch(x){return alert('這不是「作業與成績」的備份檔。')}
 if(!confirm('用備份檔取代現在的資料？（還原後可以按「復原」）'))return;
 op(()=>{S=o},'已從備份還原');closeSheet();
};

function onClick(e){
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a;
 if(a==='tab'){TAB=b.dataset.k;$('q').value='';try{localStorage.setItem('sch-tab',TAB)}catch(x){}return render()}
 if(a==='kid'){KID=b.dataset.k;try{localStorage.setItem('sch-kid',KID)}catch(x){}return render()}
 if(a==='fil'){FIL[TAB]=FIL[TAB]===b.dataset.v&&TAB==='ex'?'全部':b.dataset.v;return render()}
 if(a==='new')return newSheet();
 if(a==='set')return setSheet();
 if(a==='week')return weekSheet();
 if(a==='hw')return hwSheet(b.dataset.id);
 if(a==='ex')return exSheet(b.dataset.id);
 if(a==='hdone')return quickDone(b.dataset.id);
 if(a==='fx')return toggleFix(b.dataset.k,b.dataset.id,b.dataset.f);
 if(a==='hfix'){const h=S.hw.find(x=>x.id===b.dataset.id);if(h)op(()=>{const x=S.hw.find(y=>y.id===h.id);x.st='訂正完成';x.u=Date.now();x.log.push({t:x.u,by:me(),x:'要訂正 → 訂正完成'})},'「'+h.title+'」訂正完成 🎉');return}
 if(a==='addkid')return addKid(($('nk')||{}).value);
 if(a==='mkfam'){b.disabled=true;CL.F.create('作業與成績',{kind:'school'}).then(useFam).catch(()=>{b.disabled=false;alert('沒有成功，請確認網路後再試。')});return}
}

shell();
$('app').addEventListener('click',onClick);
$('app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=button]'))onClick(e)});
render();
cloudInit();
</script>
</body>
