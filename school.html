<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業成績">
<link rel="manifest" href="school.webmanifest">
<link rel="icon" href="school.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="school.svg">
<title>作業與成績</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7F9;--card:#fff;--tile:#F3F4F6;--ink:#1F2024;--sub:#6E7078;--line:#ECEDF0;--acc:#1F2024;--on:#fff;
 --ok:#3B8A5A;--oks:#E4F3E9;--bad:#C9483F;--bads:#FBE7E5;--warn:#C0712B;--warns:#FCEEDF;--blue:#3B6FD8;--blues:#EDF2FC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131416;--card:#1D1E21;--tile:#26282C;--ink:#EDEDEF;--sub:#9C9EA5;--line:#2E3034;--acc:#EDEDEF;--on:#131416;
 --ok:#7CC49A;--oks:#1F3328;--bad:#F08A80;--bads:#3A2321;--warn:#E8A86A;--warns:#3A2C1E;--blue:#8DB0F0;--blues:#1F2A3E}}
:root[data-theme="dark"]{--bg:#131416;--card:#1D1E21;--tile:#26282C;--ink:#EDEDEF;--sub:#9C9EA5;--line:#2E3034;--acc:#EDEDEF;--on:#131416;
 --ok:#7CC49A;--oks:#1F3328;--bad:#F08A80;--bads:#3A2321;--warn:#E8A86A;--warns:#3A2C1E;--blue:#8DB0F0;--blues:#1F2A3E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC",-apple-system,"Microsoft JhengHei",sans-serif}
#app{max-width:880px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 80px}
#app::after{content:"© 2026 mei0829 版權所有";display:block;text-align:center;font-size:11px;color:var(--sub);margin-top:28px;opacity:.8}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
input,select,textarea{font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.ps,.sub{font-size:14px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.go{background:var(--acc);color:var(--on);border:0;border-radius:14px;padding:11px 18px;font-weight:700}
.go.sm,.bt.sm{padding:6px 14px;font-size:14px;border-radius:999px}
.bt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}
#authwrap{max-width:420px;margin:0 auto;padding:40px 16px}#authwrap a{color:var(--blue)}
.afl{display:block;margin-bottom:10px}.afl span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}

/* 首頁 */
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 2px}
.top h1{font-size:28px;margin:0;font-weight:700}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px 16px;margin:14px 0}
.clsb{border:0;background:none;padding:0;font-size:21px;font-weight:700;text-align:left}
.clsb span{font-size:14px;color:var(--sub);margin-left:2px}
.badge{font-size:13px;color:var(--ok);background:var(--oks);border-radius:999px;padding:3px 12px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats button{border:0;border-radius:18px;padding:14px 14px 12px;text-align:left}
.stats b{display:block;font-size:34px;line-height:1.1;font-weight:700}
.stats span{font-size:14px;color:var(--sub)}
.st1{background:var(--blues)}.st1 b{color:var(--blue)}
.st2{background:var(--warns)}.st2 b{color:var(--warn)}
.st3{background:var(--bads)}.st3 b{color:var(--bad)}
.today{display:block;width:100%;text-align:left;border:0;background:var(--tile);border-radius:14px;padding:11px 14px;margin-top:10px;font-size:15px}
.main{display:block;width:100%;background:var(--acc);color:var(--on);border:0;border-radius:16px;padding:13px;font-weight:700;font-size:16px;margin-top:12px}
.hr{border-top:1px solid var(--line);margin:18px 0 14px}
.h2{font-size:18px;font-weight:700;margin:0 0 10px}
.fns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fn{border:0;background:var(--tile);border-radius:18px;padding:14px;text-align:left;min-height:86px}
.fn-t{display:flex;align-items:center;gap:8px}
.fn-t svg{width:22px;height:22px;flex:none;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fn b{font-size:16px}
.fn span{display:block;font-size:13.5px;color:var(--sub);margin-top:4px;line-height:1.4}

/* 內頁 */
.nav{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.bk{border:0;background:none;padding:6px 0;font-size:16px;color:var(--blue);font-weight:500}
.pt{font-size:25px;margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}
.segs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.segs::-webkit-scrollbar{display:none}
.segs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px}
.segs button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.tools{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.list{padding:4px 6px}
.lr{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 8px;border-top:1px solid var(--line)}
.lr:first-child{border-top:0}
.lt{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.lt small{display:block;font-size:13px;color:var(--sub)}
.lp{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ch{color:var(--sub);font-size:18px}
.nb{flex:none;width:40px;height:40px;border-radius:12px;background:var(--tile);display:grid;place-items:center;font-weight:700;font-size:15px}
.dt2{flex:none;width:48px;text-align:center;line-height:1.2}.dt2 b{display:block;font-size:16px}.dt2 small{font-size:12px;color:var(--sub)}
.pl{display:inline-block;padding:3px 10px;border-radius:8px;font-size:13.5px;font-weight:500;white-space:nowrap;background:var(--tile);color:var(--sub)}
.pl.ok{background:var(--oks);color:var(--ok)}.pl.bad{background:var(--bads);color:var(--bad)}.pl.warn{background:var(--warns);color:var(--warn)}
.who{display:flex;gap:14px;align-items:center}
.nbig{width:64px;height:64px;border-radius:18px;background:var(--tile);display:grid;place-items:center;font-size:26px;font-weight:700}
.who b{font-size:21px}
.st3c{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px}
.st3c b{display:block;font-size:30px;line-height:1.15}.st3c span{font-size:14px;color:var(--sub)}
.avg{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.avg span{background:var(--tile);border-radius:10px;padding:4px 10px;font-size:13.5px}
.todo{margin:0;padding-left:20px}.todo li{padding:5px 0;cursor:pointer}
.okmsg{margin-top:16px;color:var(--ok);font-weight:500}
.dbar{display:flex;gap:8px;align-items:center;margin-top:14px}
.dbar input{flex:1;height:44px}.dbar button{flex:none;height:44px;min-width:44px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts>*{flex:1 1 150px}
.empty{text-align:center;padding:26px 10px;color:var(--sub)}

/* 表格 */
.tw{overflow:auto;-webkit-overflow-scrolling:touch}
.t{width:100%;border-collapse:collapse;font-size:15px}
.t th{font-size:13.5px;color:var(--ink);font-weight:700;text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.t td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tr[data-a]{cursor:pointer}
.t td small{display:block;font-size:12.5px;color:var(--sub)}
.t .n{white-space:nowrap}
.t tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.colh{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:13.5px;line-height:1.3}
.colh small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.cell,.lk{border:0;background:none;padding:0;text-align:left}
.lk{font-size:15px;white-space:nowrap}
.lk small{display:block;font-size:12.5px;color:var(--warn)}
.gt th,.gt td{text-align:center}.gt th:first-child,.gt td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.range input{padding:7px 8px;font-size:15px}

/* 成績匯出 */
.f{display:block;margin-bottom:14px}.f>span{display:block;font-size:14px;color:var(--sub);margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radios{display:flex;flex-wrap:wrap;gap:6px 16px}
.radios button{border:0;background:none;padding:4px 0;display:flex;align-items:center;gap:7px;font-size:16px}
.radios i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.radios .on i{border:6px solid var(--acc)}
.prev{background:var(--tile);border-radius:16px;padding:12px 14px;margin:4px 0 4px}
.prev b{display:block;font-size:18px;margin:2px 0}
.wide{display:block;width:100%;margin-top:8px}

/* 彈出視窗 */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
#sheet .bkd{position:absolute;inset:0;background:rgba(0,0,0,.35)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 4px;font-size:19px}
#sheet .back{position:sticky;top:-16px;z-index:2;margin:-16px -16px 6px;padding:12px 16px 6px;background:var(--bg)}
#sheet .back button{border:0;background:none;color:var(--blue);font-size:16px;font-weight:500;padding:4px 0}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px}
.pick button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 2px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--acc);color:var(--on);font-weight:500}
.tg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.tg i{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;color:var(--on);font-size:13px}
.tg.on i{background:var(--ok);border-color:var(--ok)}
.li{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:6px}
.li>span{flex:1;min-width:0;overflow-wrap:anywhere}.li small{display:block;color:var(--sub);font-size:12px}
.li>button{border:0;background:none;padding:6px 8px;color:var(--sub)}
.li>button.cb2,.cb2{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:13px;white-space:nowrap;color:var(--sub)}
.cb2.on{background:var(--oks);border-color:transparent;color:var(--ok);font-weight:500}
.li input,.li select{padding:5px 8px}
.li input.no{width:56px;flex:none;text-align:center}
.add{display:flex;gap:8px;margin:8px 0 4px}.add input,.add select{flex:1}.add button{flex:none}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.quick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13.5px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--tile);color:var(--sub);margin-right:4px;font-weight:500;white-space:nowrap}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
#sheet h2{font-size:14px;margin:18px 2px 8px;color:var(--sub);font-weight:500}

/* 計算機輸入分數 */
.kpw{display:flex;align-items:center;gap:8px;margin-top:12px}
.kpa{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px}
.kpn{flex:1;text-align:center;line-height:1.3}.kpn small{display:block;color:var(--sub);font-size:14px}.kpn b{font-size:24px}
.kpd{background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:right;font-size:46px;font-weight:700;padding:6px 18px;margin:10px 0;font-variant-numeric:tabular-nums;min-height:78px}
.kpd small{font-size:18px;color:var(--sub);font-weight:400;margin-left:6px}
.kpd.old{color:var(--sub)}
.kpk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpk button,.kpb button{height:58px;border-radius:16px;border:0;background:var(--card);font-size:24px;font-weight:500;box-shadow:0 1px 0 var(--line)}
.kpb{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:8px}
.kpb button{font-size:16px}
.kpb .go{font-size:18px;background:var(--acc);color:var(--on);font-weight:700}
.kpq{display:flex;gap:6px;margin-top:8px}.kpq button{flex:1;border:1px solid var(--line);background:none;border-radius:12px;padding:7px 0;font-size:15px}
.kpl{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.kpl button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:5px 10px;font-size:13px;text-align:center;line-height:1.3}
.kpl button b{display:block;font-size:15px}
.kpl button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.kpl button.has b{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 14px;font-size:14px;display:none;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.on{display:flex}
#toast button{border:0;background:none;color:#8DB0F0;font-weight:700;padding:0;white-space:nowrap}

@media (min-width:760px){
 .fns{grid-template-columns:repeat(3,1fr)}
 #sheet .pn{top:50%;bottom:auto;transform:translateY(-50%);border-radius:22px;max-height:90vh;padding-bottom:18px}
}
</style>
</head>
<body>
<div id="auth" data-title="作業與成績"></div>
<div id="app"></div><div id="sheet"></div><div id="toast"></div>
<input type="file" id="impf" accept="application/json,.json" style="display:none">
<script type="module" src="auth.js"></script>
<script type="text/plain" id="app-src">
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const nid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const DEF_SUBS=['國語','數學','社會','自然','英語','其他'];
// 作業種類：g=1 預設要打分數（考卷）
const DEF_CATS=[['國語習作','國語'],['國語甲本','國語'],['國語乙本','國語'],['圈詞','國語'],['生字簿','國語'],['國語考卷','國語',1],
 ['數學習作','數學'],['數學練習簿','數學'],['數學考卷','數學',1],['社會習作','社會'],['社會練習簿','社會'],['社會考卷','社會',1],
 ['自然習作','自然'],['自然考卷','自然',1],['英語作業','英語'],['英語考卷','英語',1]].map(([n,s,g])=>({n,s,g:g?1:0}));

// ---------- 日期 ----------
const z=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const today=()=>ymd(new Date());
const DT=/^\d{4}-\d{2}-\d{2}$/;
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const WK='日一二三四五六';
const md=s=>s?(pd(s).getMonth()+1)+'/'+pd(s).getDate():'';
const mdw=s=>s?md(s)+'（'+WK[pd(s).getDay()]+'）':'';
const dayN=s=>Math.round((pd(s)-pd(today()))/864e5);
const dl=s=>{if(!s)return '';const n=dayN(s);return n===0?'今天':n===1?'明天':n===-1?'昨天':mdw(s)};
// 學期開始：8 月～1 月是上學期，2 月～7 月是下學期
const semStart=()=>{const d=new Date(),m=d.getMonth()+1,y=d.getFullYear();return m>=8?y+'-08-01':m===1?(y-1)+'-08-01':y+'-02-01'};
const who=e=>e?String(e).split('@')[0]:'';
const arr=a=>Array.isArray(a)?a:[];
const numOr=v=>v===''||v==null||isNaN(+v)?'':+v;
const r1=n=>Math.round(n*10)/10;
const scCls=p=>p==null?'':p>=90?'ok':p<60?'bad':'';

// ---------- 資料 ----------
// S：班級、學生、科目、作業種類（雲端文件 school）
// TK[班級id]：這個班的作業，每份作業記全班每個人交了沒、分數、訂正（雲端文件 school_c_班級id，一班一份，資料才不會太大）
// 每個人的紀錄 r[學生id]：s 1已交 2免交（沒有=未交）、a 交的日期、c 分數、f 1要訂正 2訂正完成、p 訂正哪裡、fa 訂正完成日、b 已寫聯絡簿、n 備註
function fixMeta(o){
 if(!o||typeof o!=='object'||!Array.isArray(o.classes))throw new Error('bad');
 const classes=o.classes.filter(c=>c&&c.name).map(c=>({id:c.id||nid(),name:String(c.name),stus:arr(c.stus).filter(s=>s&&s.name).map(s=>({id:s.id||nid(),no:numOr(s.no),name:String(s.name)}))}));
 let subs=[...new Set(arr(o.subs).map(s=>String(s).trim()).filter(Boolean))];if(!subs.length)subs=DEF_SUBS.slice();
 const seen=new Set();
 let cats=arr(o.cats).filter(c=>c&&c.n&&!seen.has(c.n)&&seen.add(c.n)).map(c=>({n:String(c.n),s:String(c.s||'其他'),g:c.g?1:0}));
 if(!cats.length)cats=DEF_CATS.map(c=>({...c}));
 return {classes,subs,cats};
}
function fixRec(r){
 const o={};if(!r||typeof r!=='object')return o;
 if(r.s===1||r.s===2)o.s=r.s;
 if(o.s===1&&DT.test(r.a))o.a=r.a;
 const c=numOr(r.c);if(c!=='')o.c=c;
 if(r.f===1||r.f===2)o.f=r.f;
 if(o.f&&r.p)o.p=String(r.p);
 if(o.f===2&&DT.test(r.fa))o.fa=r.fa;
 if(r.b)o.b=1;if(r.n)o.n=String(r.n);
 return o;
}
function fixTasks(a){
 return arr(a).filter(t=>t&&(t.cat||t.title)).map(t=>{
  const r={};Object.keys(t.r&&typeof t.r==='object'?t.r:{}).forEach(k=>{const x=fixRec(t.r[k]);if(Object.keys(x).length)r[k]=x});
  return {id:t.id||nid(),sub:String(t.sub||'其他'),cat:String(t.cat||''),title:String(t.title||''),d:DT.test(t.d)?t.d:today(),due:DT.test(t.due)?t.due:'',

const STK=[];let PEND=null;
function go(pg){PG=pg;DEPTH++;try{history.pushState({pg,dp:DEPTH,lv:0},'')}catch(e){}render();scrollTo(0,0)}
function goBack(){if(DEPTH>0)history.back();else{PG={v:'home'};render()}}
try{history.replaceState({pg:PG,dp:0,lv:0},'')}catch(e){}
function openS(fn,live){STK.push({fn,live:!!live});try{history.pushState({pg:PG,dp:DEPTH,lv:STK.length},'')}catch(e){}fn()}
function sheet(html,bind){
 const s=$('sheet');
 s.innerHTML=`<div class="bkd"></div><div class="pn"><div class="back"><button data-back>‹ ${STK.length>1?'返回':'關閉'}</button></div>${html}</div>`;s.classList.add('on');
 s.querySelector('.bkd').onclick=()=>closeAll();
 s.querySelector('[data-back]').onclick=back;
 s.querySelectorAll('[data-x]').forEach(b=>b.onclick=back);
 if(bind)bind(s.querySelector('.pn'));
}
function after(){
 if(STK.length)refresh(STK[STK.length-1].fn);
 else{const s=$('sheet');s.classList.remove('on');s.innerHTML='';KP=null}
 applyPending();
}
function back(){if(history.state&&history.state.lv)history.back();else{STK.pop();after()}}
// 關掉所有視窗；then：關掉之後要做的事（例如換頁）
function closeAll(then){PEND=then||null;const n=history.state&&history.state.lv||0;if(n)history.go(-n);else{STK.length=0;after();runPend()}}
function runPend(){if(PEND){const f=PEND;PEND=null;f()}}
addEventListener('popstate',e=>{
 const st=e.state||{},lv=st.lv||0;
 if(STK.length>lv){STK.length=lv;after();if(!lv)runPend();return}
 if(STK.length){STK.length=0;after()}
 PG=st.pg||{v:'home'};DEPTH=st.dp||0;render();
});
$('sheet').addEventListener('focusout',()=>setTimeout(applyPending,400));
const enter=(el,fn)=>{if(el)el.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();fn()}}};
function refresh(fn){const pn=document.querySelector('#sheet .pn'),y=pn?pn.scrollTop:0;fn();const p2=document.querySelector('#sheet .pn');if(p2)p2.scrollTop=y}
const rs=()=>{if(STK.length&&STK[STK.length-1].live)refresh(STK[STK.length-1].fn)};

// 計算機：一位一位輸入分數，按「確定」跳下一位
function kpSheet(tid,sid0){
 const t0=task(tid);if(!t0)return back();
 const ss=stus(cls());if(!ss.length)return back();
 const st={i:0,buf:'',done:false};
 if(sid0){const i=ss.findIndex(s=>s.id===sid0);if(i>=0)st.i=i}
 else{const i=ss.findIndex(s=>R(t0,s.id).c===undefined&&R(t0,s.id).s!==2);st.i=i<0?0:i}
 const save=()=>{
  if(st.buf===''||st.buf==='.')return true;
  const v=+st.buf,t=task(tid),s=ss[st.i];if(isNaN(v))return true;
  if(v>t.full*1.5){toast('超過滿分 '+t.full+'，請再確認');return false}
  op(()=>{const x=task(tid),r=R(x,s.id);setR(x,s.id,!isIn(r)||r.s===2?{c:v,s:1,a:x.due&&x.due<today()?x.due:today()}:{c:v})});
  st.buf='';return true;
 };
 const move=n=>{st.buf='';const j=st.i+n;if(j>=ss.length){st.done=true}else if(j>=0)st.i=j};
 const press=k=>{
  if(st.done&&k!=='again')return;
  if(/^\d$/.test(k)){if(st.buf.replace('.','').length<4)st.buf=(st.buf==='0'?'':st.buf)+k}
  else if(k==='.'){if(!st.buf.includes('.'))st.buf=(st.buf||'0')+'.'}
  else if(k==='del')st.buf=st.buf.slice(0,-1);
  else if(k==='clr'){st.buf='';op(()=>setR(task(tid),ss[st.i].id,{c:''}))}
  else if(k==='ok'){if(save())move(1)}
  else if(k==='next'){if(save())move(1)}
  else if(k==='prev'){if(save())move(-1)}
  else if(k==='skip'){op(()=>setR(task(tid),ss[st.i].id,{s:2,a:'',c:''}));move(1)}
  else if(k[0]==='q'){st.buf=k.slice(1);if(save())move(1)}
  else if(k[0]==='j'){if(save()){st.i=+k.slice(1);st.buf=''}}
  else if(k==='again'){st.done=false;st.i=0;st.buf=''}
  draw();
 };
 const draw=()=>{
  const t=task(tid);if(!t)return back();
  const n=ss.filter(s=>R(t,s.id).c!==undefined).length;
  if(st.done){const A=tStats(t,ss);
   return sheet(`<h3>${E(tName(t))}</h3><div class="empty" style="font-size:18px;color:var(--ink)">全部輸入完成 🎉<div class="ps" style="margin-top:6px">已輸入 ${n}/${ss.length} 位${A.avg!=null?' · 平均 '+r1(A.avg):''}</div></div>
    <div style="display:grid;gap:8px"><button class="main" style="margin:0" data-x>完成</button><button class="bt" data-k="again">從第一位再檢查一次</button></div>`,p=>p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k)));
  }
  const s=ss[st.i],r=R(t,s.id);
  sheet(`<h3>${E(tName(t))}</h3><div class="ps">滿分 ${t.full} · 已輸入 ${n}/${ss.length} 位</div>
   <div class="kpw"><button class="kpa" data-k="prev" aria-label="上一位">‹</button><div class="kpn"><small>${s.no!==''?s.no+' 號':''}</small><b>${E(s.name)}</b></div><button class="kpa" data-k="next" aria-label="下一位">›</button></div>
   <div class="kpd${st.buf?'':' old'}">${st.buf||(r.c!==undefined?r.c:r.s===2?'缺考':'&nbsp;')}<small>/ ${t.full}</small></div>
   <div class="kpk">${['7','8','9','4','5','6','1','2','3','.','0','del'].map(k=>`<button data-k="${k}">${k==='del'?'⌫':k}</button>`).join('')}</div>
   <div class="kpb"><button data-k="skip">缺考／免</button><button data-k="clr">清除</button><button class="go" data-k="ok">確定 ›</button></div>
   ${t.full===100?`<div class="kpq">${[100,95,90,85,80,70].map(v=>`<button data-k="q${v}">${v}</button>`).join('')}</div>`:''}
   <div class="kpl">${ss.map((x,i)=>{const c=R(t,x.id).c;return `<button data-k="j${i}" class="${i===st.i?'on':''}${c!==undefined?' has':''}">${x.no!==''?x.no:''} ${E(x.name)}<b>${c!==undefined?c:'—'}</b></button>`}).join('')}</div>`,p=>{
   p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
   const on=p.querySelector('.kpl .on');if(on)on.scrollIntoView({block:'nearest',inline:'center'});
  });
 };
 const top=STK[STK.length-1];top.fn=draw;top.kp=1;
 KP={press};
 draw();
}

function missText(){
 const ss=stus(cls()),d=BD;
 const L=[`${cls().name}　${mdw(d)} 還沒完成`];
 tasks().filter(t=>(t.due&&t.due<=d)||ss.some(s=>fixing(t,s.id))).sort((a,b)=>tDate(a)<tDate(b)?-1:1).forEach(t=>{
  const m=ss.filter(s=>missing(t,s.id,d)),f=ss.filter(s=>fixing(t,s.id));
  if(!m.length&&!f.length)return;
  L.push('',`【${t.sub}】${tName(t)}${t.due?'（'+md(t.due)+' 交）':''}`);

 });
 return L.length>1?L.join('\n'):L[0]+'：沒有，大家都完成了 🎉';
}

// ---------- 設定：班級、學生、科目、作業種類、一起管理、匯出 ----------
// 學生名單：一行一位，前面可以有座號（例如「3 王小明」、「3.王小明」、從 Excel 貼上的「3⇥王小明」）
function parseStus(text,c){
 let next=Math.max(0,...c.stus.map(s=>+s.no||0))+1;const out=[];
 String(text||'').split(/\r?\n|，|,/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
  const m=line.match(/^(\d+)\s*[\.、．號:：\-\t ]\s*(.+)$/);
  let no,name;if(m){no=+m[1];name=m[2].trim()}else{no=next;name=line}
  name=name.split(/\t/)[0].trim();if(!name)return;
  if(c.stus.some(s=>s.name===name)||out.some(s=>s.name===name))return;
  out.push({id:nid(),no,name});next=Math.max(next,no)+1;
 });
 return out;
}
function mkClass(name,text){

 if(S.classes.some(c=>c.name===name))return toast('已經有「'+name+'」了');
 const c={id:nid(),name,stus:[]};c.stus=parseStus(text,c);
 op(()=>{S.classes.push(c);TK[c.id]=[];CID=c.id;try{localStorage.setItem('sch-cls',c.id)}catch(e){}},'已建立「'+name+'」'+(c.stus.length?'，'+c.stus.length+' 位學生':''));
}

function famBind(p){
 const f=CL.fam;if(!f)return;
 const save=async(o,ok)=>{try{await CL.F.update(f.id,o);Object.assign(f,o);ok&&ok()}catch(e){alert('沒有成功，請確認網路後再試。')}};
 const nm=p.querySelector('#fnm');
 if(nm)nm.onchange=()=>{const n=nm.value.trim();if(n&&n!==f.name)save({name:n},()=>status('✓ 已同步'))};
 p.querySelectorAll('[data-fm]').forEach(b=>b.onclick=()=>{
  const m=b.dataset.fm;if(!confirm('把 '+m+' 移出「'+f.name+'」？對方就看不到這裡的資料了。'))return;
  save({members:f.members.filter(x=>x!==m)},()=>refresh(setSheet));
 });
 const add=async()=>{
  const m=p.querySelector('#fem').value.trim().toLowerCase(),msg=p.querySelector('#fmsg');
  if(!EMAIL.test(m)){msg.textContent='Email 格式不正確';msg.className='sub bad';return}
  if(f.members.includes(m)){msg.textContent='這位已經是成員了';msg.className='sub bad';return}
  // 管理員邀請時，順便把對方加進網站的邀請名單，對方才能登入
  if(window.FBA&&FBA.add&&!(FBA.list||[]).includes(m)){const err=await FBA.add(m);if(err){msg.textContent=err;msg.className='sub bad';return}}
  save({members:[...f.members,m]},()=>refresh(setSheet));
 };
 const fb=p.querySelector('#feb');
 if(fb){fb.onclick=add;enter(p.querySelector('#fem'),add)}
 p.querySelectorAll('[data-fsw]').forEach(b=>b.onclick=()=>{
  const x=CL.fams.find(y=>y.id===b.dataset.fsw);
  if(!confirm('切換到「'+x.name+'」？這支手機會改顯示那邊的資料。'))return;
  closeAll();useFam(x);
 });
}
const csvCell=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const csv=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function download(name,text,type){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
const stamp=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

   p.querySelectorAll('[data-sdl]').forEach(b=>b.onclick=()=>{

$('impf').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 let m,tk={};
 try{const o=JSON.parse(await f.text());m=fixMeta(o.meta);m.classes.forEach(c=>tk[c.id]=fixTasks((o.tasks||{})[c.id]))}catch(x){return alert('這不是「作業與成績」的備份檔。')}
 if(!confirm('用備份檔取代現在的資料？（'+m.classes.length+' 個班級；還原後可以按「復原」）'))return;
 op(()=>{S=m;TK=tk},'已從備份還原');closeAll();
};

// 成績表：某班、某科、某段日期
function gradeData(cid,sub,from,to){
 const c=S.classes.find(x=>x.id===cid),ss=stus(c);
 const ts=(TK[cid]||[]).filter(t=>t.g&&(sub==='全部'||t.sub===sub)&&tDate(t)>=from&&tDate(t)<=to).sort((a,b)=>tDate(a)<tDate(b)?-1:tDate(a)>tDate(b)?1:a.t-b.t);
 const rows=ss.map(s=>{const v=ts.map(t=>R(t,s.id).c),ps=ts.map((t,i)=>v[i]===undefined?null:v[i]/t.full*100).filter(x=>x!=null);return {s,v,avg:ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null}});
 const colAvg=ts.map((t,i)=>{const x=rows.map(r=>r.v[i]).filter(v=>v!==undefined);return x.length?x.reduce((a,b)=>a+b,0)/x.length:null});
 return {c,ss,ts,rows,colAvg};
}
function gradeCSV(cid,sub,from,to){
 const {c,ts,rows,colAvg}=gradeData(cid,sub,from,to);
 if(!ts.length)return toast('這段時間沒有成績');
 const out=[['座號','姓名',...ts.map(t=>md(tDate(t))+' '+(t.cat?'':t.sub+' ')+tName(t)+(t.full!==100?'（滿分'+t.full+'）':'')),'平均（換算100分）']];
 rows.forEach(r=>out.push([r.s.no,r.s.name,...r.v.map((v,i)=>v===undefined?(R(ts[i],r.s.id).s===2?'免':''):v),r.avg==null?'':r1(r.avg)]));
 out.push(['','班平均',...colAvg.map(a=>a==null?'':r1(a)),'']);
 download(fname(`${c.name}-${sub==='全部'?'全部科目':sub}成績-${from}到${to}`)+'.csv',csv(out),'text/csv');
}
function hwCSV(cid,sub,from,to){
 const c=S.classes.find(x=>x.id===cid),ss=stus(c),ts=(TK[cid]||[]).filter(t=>(sub==='全部'||t.sub===sub)&&tDate(t)>=from&&tDate(t)<=to).sort((a,b)=>tDate(a)<tDate(b)?-1:1);
 if(!ts.length)return toast('這段時間沒有作業');
 const out=[['座號','姓名',...ts.map(t=>md(tDate(t))+' '+(t.cat?'':t.sub+' ')+tName(t)),'沒交','遲交','要訂正']];
 ss.forEach(s=>{let m=0,l=0,f=0;
  const cells=ts.map(t=>{const r=R(t,s.id),k=stOf(t,s.id);if(k==='late')l++;if(missing(t,s.id))m++;if(r.f===1)f++;
   return [k==='ok'?'✓':k==='late'?'遲交 '+md(r.a):k==='x'?'免交':missing(t,s.id)?'沒交':'',r.c!==undefined?r.c+'分':'',r.f===1?'待訂正'+(r.p?' '+r.p:''):r.f===2?'訂正完成':''].filter(Boolean).join(' ')});
  out.push([s.no,s.name,...cells,m,l,f]);
 });
 download(fname(`${c.name}-${sub==='全部'?'全部科目':sub}繳交紀錄-${from}到${to}`)+'.csv',csv(out),'text/csv');
}

// ---------- 點擊 ----------
const PAGE_ACTS=new Set(['go','stu','task']);
function onClick(e){
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,ds=b.dataset,inSheet=$('sheet').contains(b);
 if(b.tagName==='A')e.preventDefault();
 // 從視窗裡換頁：先關掉視窗
 if(PAGE_ACTS.has(a)&&inSheet){const pg=a==='go'?{v:ds.v}:a==='stu'?{v:'stu',id:ds.s}:{v:'task',id:ds.id};return closeAll(()=>go(pg))}
 if(a==='go')return go({v:ds.v});
 if(a==='stu')return go({v:'stu',id:ds.s});
 if(a==='task')return go({v:'task',id:ds.id});
 if(a==='back')return goBack();
 if(a==='set')return openS(setSheet);
 if(a==='clspick')return openS(clsSheet);
 if(a==='new')return openS(()=>taskEdit(null,ds.due?{due:ds.due}:null));
 if(a==='tedit')return openS(()=>taskEdit(ds.id));
 if(a==='tcopy'){const t=task(ds.id);if(t)openS(()=>taskEdit(null,{sub:t.sub,cat:t.cat,g:t.g,full:t.full}));return}
 if(a==='mkcls')return mkClass($('ncn').value,$('ncs').value);
 if(a==='mkfam'){b.disabled=true;CL.F.create('作業與成績',{kind:'school'}).then(useFam).catch(()=>{b.disabled=false;alert('沒有成功，請確認網路後再試。')});return}
 if(a==='sfl'){SFL=ds.v;return render()}
 if(a==='ssub'){PG.sub=ds.v;try{history.replaceState({...history.state,pg:PG},'')}catch(x){}return render()}
 if(a==='df'){DF=ds.v;return render()}
 if(a==='bd'){BD=ds.v==='0'?today():addD(BD,+ds.v);return render()}
 if(a==='tf'){TF.sub=ds.v;return render()}
 if(a==='tf2'){PG.f=ds.v;try{history.replaceState({...history.state,pg:PG},'')}catch(x){}return render()}
 if(a==='gsub'){GF.sub=ds.v;return render()}
 if(a==='gr'){[GF.from,GF.to]=RANGE(ds.v);return render()}
 if(a==='fxf'){FXF=ds.v;return render()}
 if(a==='exsub'){EX.sub=ds.v;return render()}
 if(a==='exr'){[EX.from,EX.to]=RANGE(ds.v);return render()}
 if(a==='exg')return gradeCSV(EX.cid||cls().id,EX.sub,EX.from,EX.to);
 if(a==='exh')return hwCSV(EX.cid||cls().id,EX.sub,EX.from,EX.to);
 if(a==='col')return openS(()=>colSheet(ds.id));
 if(a==='cbook')return openS(cbookSheet,true);
 if(a==='kpick')return openS(kpickSheet);
 if(a==='kp')return openS(()=>kpSheet(ds.id,ds.s));
 if(a==='rec')return openS(()=>recSheet(ds.t,ds.s));
 if(a==='remind')return openS(()=>textSheet('聯絡簿提醒',remindText(ds.s)));
 if(a==='misscopy')return openS(()=>textSheet('還沒完成的名單',missText()));
 const t=ds.t&&task(ds.t),s=ds.s&&stu(ds.s);
 if(a==='allin'&&t){allIn(t.id,t.due&&t.due<today()?t.due:today());return rs()}
 if(!t||!s)return;
 const d=ds.d||(t.due&&t.due<today()?today():today());
 if(a==='tog'){const r=R(t,s.id);op(()=>setR(t,s.id,isIn(r)?{s:0}:{s:1,a:d}),isIn(r)?sLabel(s)+' 改成未交':null);return rs()}
 if(a==='cfx'){const f=R(t,s.id).f||0;op(()=>setR(t,s.id,f===0?{f:1}:f===1?{f:2,fa:today()}:{f:0,p:''}),f===0?sLabel(s)+' 待訂正（點名字可以寫訂正哪幾頁）':null);return rs()}
 if(a==='fixed'){op(()=>setR(t,s.id,{f:2,fa:today()}),sLabel(s)+' '+tName(t)+' 訂正好了');return rs()}
}
