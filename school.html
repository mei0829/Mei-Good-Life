<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業成績">
<link rel="manifest" href="school.webmanifest">
<link rel="icon" href="school.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="school.svg">
<title>作業與成績</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#2B2A27;--sub:#737780;--line:#DDE2EA;--acc:#4F6F8C;--on:#fff;--ok:#3F8A5F;--bad:#C94A4A;--warn:#B7791F;--soft:#E1E7EF;--oks:#E2F0E7;--bads:#F7E1E1;--warns:#F7ECD9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171A;--card:#202328;--ink:#EDEAE4;--sub:#A0A4AC;--line:#30343B;--acc:#8DB0D0;--on:#15171A;--ok:#7CC49A;--bad:#F07070;--warn:#E3B062;--soft:#29303A;--oks:#22342A;--bads:#3A2526;--warns:#3A3020}}
:root[data-theme="dark"]{--bg:#15171A;--card:#202328;--ink:#EDEAE4;--sub:#A0A4AC;--line:#30343B;--acc:#8DB0D0;--on:#15171A;--ok:#7CC49A;--bad:#F07070;--warn:#E3B062;--soft:#29303A;--oks:#22342A;--bads:#3A2526;--warns:#3A3020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC",-apple-system,"Microsoft JhengHei",sans-serif}
#app{max-width:1040px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 90px}
#app::after{content:"© 2026 mei0829 版權所有";display:block;text-align:center;font-size:11px;color:var(--sub);margin-top:28px;opacity:.8}
h1{font-size:24px;margin:4px 0 0;font-weight:700}
h2{font-size:14px;margin:18px 2px 8px;color:var(--sub);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
input,select,textarea{font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}
.sub{font-size:13px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.go{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:10px 16px;font-weight:700}
.bt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.bt.sm{padding:4px 10px;font-size:13px;border-radius:999px;white-space:nowrap}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
#authwrap{max-width:420px;margin:0 auto;padding:40px 16px}#authwrap a{color:var(--acc)}
.afl{display:block;margin-bottom:10px}.afl span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.top .row{flex-wrap:nowrap}
.home{font-size:14px;text-decoration:none}
#st{font-size:12px;color:var(--sub);margin:2px 0 8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:10px}
.tabs button{border:0;background:none;border-radius:10px;padding:7px 4px;font-weight:500;color:var(--sub)}
.tabs button.on{background:var(--acc);color:var(--on)}
.tabs i{font-style:normal;font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:1px}
.bar{display:flex;gap:8px;justify-content:flex-end}.bar input{flex:1;border-radius:14px;height:42px}.bar .go{flex:none;border-radius:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
#cls{padding:0 0 10px}
#cls button{font-size:15px;padding:6px 14px;font-weight:500}
#cls button small{font-weight:400;opacity:.75;font-size:12px}

.it{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.it .bd{flex:1;min-width:0}
.it b{font-size:16px;overflow-wrap:anywhere;font-weight:500}
.it .ln{font-size:13px;color:var(--sub);margin-top:3px;overflow-wrap:anywhere}
.db{flex:none;width:50px;text-align:center;border-radius:10px;background:var(--soft);color:var(--acc);padding:3px 0;line-height:1.25}
.db b{display:block;font-size:17px;font-weight:700}.db span{font-size:11px}
.db.bad{background:var(--bads);color:var(--bad)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--acc);margin-right:4px;font-weight:500;white-space:nowrap}
.tag.g{background:none;border:1px solid var(--line);color:var(--sub)}
.tag.ok{background:var(--oks);color:var(--ok)}.tag.bad{background:var(--bads);color:var(--bad)}.tag.warn{background:var(--warns);color:var(--warn)}
.empty{text-align:center;padding:28px 12px;color:var(--sub)}
.gone{text-align:center;padding:40px 16px}
.sumr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:10px}
.sumr div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 4px}
.sumr b{display:block;font-size:20px}.sumr span{font-size:12px;color:var(--sub)}
.dbar{display:flex;gap:6px;align-items:center;margin-top:2px}
.dbar input{flex:1;height:40px}.dbar button{flex:none;height:40px}

/* 學生名字按鈕：綠色交了、橘色遲交、紅色還沒交 */
.ros{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sb{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 9px;font-size:14px;line-height:1.3;white-space:nowrap}
.sb.ok{background:var(--oks);border-color:transparent;color:var(--ok)}
.sb.late{background:var(--warns);border-color:transparent;color:var(--warn)}
.sb.miss{background:var(--bads);border-color:transparent;color:var(--bad);font-weight:500}
.sb.x{opacity:.5;text-decoration:line-through}
.sb small{font-size:11px;opacity:.8;margin-left:2px}
.nm{border:0;background:none;padding:0;font-weight:700;font-size:16px;color:var(--ink);text-align:left}
.ow{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:7px 0;flex-wrap:wrap}
.card>.ow:nth-child(2){border-top:0}
.ow .ot{flex:1;min-width:160px;overflow-wrap:anywhere}
.ow .oa{display:flex;gap:4px;flex:none;align-items:center;margin-left:auto}
.cb2{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 8px;font-size:12px;white-space:nowrap;color:var(--sub)}
.cb2.on{background:var(--soft);border-color:var(--acc);color:var(--acc);font-weight:500}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.sc2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left}
.sc2 b{font-size:16px;font-weight:500;display:block}
.sc2 .no{color:var(--sub);font-size:13px;margin-right:4px}
.sc2 .m{font-size:12.5px;margin-top:2px}
.sc2.owe{border-color:var(--bad)}

/* 一份作業的全班名單 */
.rw{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding:7px 0;flex-wrap:wrap}
.rw:first-child{border-top:0}
.rw .nm{flex:1;min-width:60px;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .nm small{color:var(--sub);font-weight:400;margin-right:4px}
.rw .scn{width:60px;flex:none;text-align:right;padding:5px 8px}
.rw .fp{flex-basis:100%;padding:5px 9px;font-size:14px}
.fxs{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 7px;font-size:13px;white-space:nowrap;color:var(--sub)}
.fxs.f1{background:var(--warns);border-color:transparent;color:var(--warn);font-weight:500}
.fxs.f2{background:var(--oks);border-color:transparent;color:var(--ok)}
.more{border:0;background:none;color:var(--sub);padding:4px 2px}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:8px 0}
.sbx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.sbx .n{font-size:12px;color:var(--sub)}.sbx b{font-size:19px}

/* 成績表 */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:10px;max-height:70vh}
table{border-collapse:separate;border-spacing:0;font-size:13.5px;white-space:nowrap;width:100%}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:center}
thead th{position:sticky;top:0;background:var(--card);z-index:1;font-weight:500;color:var(--sub);font-size:12px;line-height:1.35;vertical-align:bottom}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card);text-align:left;z-index:1}
thead th:first-child{z-index:2}
tfoot td{font-weight:700;background:var(--soft)}
.flt{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-top:10px}
.flt label span{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.flt input,.flt select{padding:7px 6px;font-size:15px}

#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.35)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 4px;font-size:19px}
#sheet .back{position:sticky;top:-16px;z-index:2;margin:-16px -16px 6px;padding:12px 16px 6px;background:var(--bg)}
#sheet .back button{border:0;background:none;color:var(--acc);font-size:16px;font-weight:500;padding:4px 0}
.f{display:block;margin-bottom:12px}.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px}
.pick button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:6px 2px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--acc);color:var(--on);font-weight:500}
.tg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:12px}
.tg i{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;color:var(--on);font-size:13px}
.tg.on i{background:var(--ok);border-color:var(--ok)}
.li{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 10px;margin-bottom:6px}
.li>span{flex:1;min-width:0;overflow-wrap:anywhere}.li small{display:block;color:var(--sub);font-size:12px}
.li>button{border:0;background:none;padding:6px 8px;color:var(--sub)}
.li>button.cb2{border:1px solid var(--line);padding:3px 8px}
.li input,.li select{padding:5px 8px}
.li input.no{width:56px;flex:none;text-align:center}
.add{display:flex;gap:8px;margin:8px 0 4px}.add input,.add select{flex:1}.add button{flex:none}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.quick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13px}
.hr{border-top:1px solid var(--line);margin:8px 0}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 14px;font-size:14px;display:none;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.on{display:flex}
#toast button{border:0;background:none;color:var(--acc);font-weight:700;padding:0;white-space:nowrap}

/* 電腦：清單排成兩欄，視窗放在畫面中間 */
@media (min-width:820px){
 .grp{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;align-items:start}
 .grp>.it,.grp>.card{margin-bottom:10px}
 #sheet .pn{top:50%;bottom:auto;transform:translateY(-50%);border-radius:20px;max-height:88vh;padding-bottom:18px;max-width:720px}
}
</style>
</head>
<body>
<div id="auth" data-title="作業與成績"></div>
<div id="app"></div><div id="sheet"></div><div id="toast"></div>
<input type="file" id="impf" accept="application/json,.json" style="display:none">
<script type="module" src="auth.js"></script>
<script type="text/plain" id="app-src">
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const nid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const DEF_SUBS=['國語','數學','社會','自然','英語','其他'];
// 作業種類：g=1 預設要打分數（考卷）
const DEF_CATS=[['國語習作','國語'],['國語甲本','國語'],['國語乙本','國語'],['圈詞','國語'],['生字簿','國語'],['國語考卷','國語',1],
 ['數學習作','數學'],['數學練習簿','數學'],['數學考卷','數學',1],['社會習作','社會'],['社會練習簿','社會'],['社會考卷','社會',1],
 ['自然習作','自然'],['自然考卷','自然',1],['英語作業','英語'],['英語考卷','英語',1]].map(([n,s,g])=>({n,s,g:g?1:0}));

// ---------- 日期 ----------
const z=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const today=()=>ymd(new Date());
const DT=/^\d{4}-\d{2}-\d{2}$/;
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const WK='日一二三四五六';
const md=s=>s?(pd(s).getMonth()+1)+'/'+pd(s).getDate():'';
const mdw=s=>s?md(s)+'（'+WK[pd(s).getDay()]+'）':'';
const dayN=s=>Math.round((pd(s)-pd(today()))/864e5);
const dl=s=>{if(!s)return '';const n=dayN(s);return n===0?'今天':n===1?'明天':n===-1?'昨天':mdw(s)};
// 學期開始：8 月～1 月是上學期，2 月～7 月是下學期
const semStart=()=>{const d=new Date(),m=d.getMonth()+1,y=d.getFullYear();return m>=8?y+'-08-01':m===1?(y-1)+'-08-01':y+'-02-01'};
const who=e=>e?String(e).split('@')[0]:'';
const arr=a=>Array.isArray(a)?a:[];
const numOr=v=>v===''||v==null||isNaN(+v)?'':+v;
const r1=n=>Math.round(n*10)/10;
const scCls=p=>p==null?'':p>=90?'ok':p<60?'bad':'';

// ---------- 資料 ----------
// S：班級、學生、科目、作業種類（雲端文件 school）
// TK[班級id]：這個班的作業，每份作業記全班每個人交了沒、分數、訂正（雲端文件 school_c_班級id，一班一份，資料才不會太大）
// 每個人的紀錄 r[學生id]：s 1已交 2免交（沒有=未交）、a 交的日期、c 分數、f 1要訂正 2訂正完成、p 訂正哪裡、fa 訂正完成日、b 已寫聯絡簿、n 備註
function fixMeta(o){
 if(!o||typeof o!=='object'||!Array.isArray(o.classes))throw new Error('bad');
 const classes=o.classes.filter(c=>c&&c.name).map(c=>({id:c.id||nid(),name:String(c.name),stus:arr(c.stus).filter(s=>s&&s.name).map(s=>({id:s.id||nid(),no:numOr(s.no),name:String(s.name)}))}));
 let subs=[...new Set(arr(o.subs).map(s=>String(s).trim()).filter(Boolean))];if(!subs.length)subs=DEF_SUBS.slice();
 const seen=new Set();
 let cats=arr(o.cats).filter(c=>c&&c.n&&!seen.has(c.n)&&seen.add(c.n)).map(c=>({n:String(c.n),s:String(c.s||'其他'),g:c.g?1:0}));
 if(!cats.length)cats=DEF_CATS.map(c=>({...c}));
 return {classes,subs,cats};
}
function fixRec(r){
 const o={};if(!r||typeof r!=='object')return o;
 if(r.s===1||r.s===2)o.s=r.s;
 if(o.s===1&&DT.test(r.a))o.a=r.a;
 const c=numOr(r.c);if(c!=='')o.c=c;
 if(r.f===1||r.f===2)o.f=r.f;
 if(o.f&&r.p)o.p=String(r.p);
 if(o.f===2&&DT.test(r.fa))o.fa=r.fa;
 if(r.b)o.b=1;if(r.n)o.n=String(r.n);
 return o;
}
function fixTasks(a){
 return arr(a).filter(t=>t&&(t.cat||t.title)).map(t=>{
  const r={};Object.keys(t.r&&typeof t.r==='object'?t.r:{}).forEach(k=>{const x=fixRec(t.r[k]);if(Object.keys(x).length)r[k]=x});
  return {id:t.id||nid(),sub:String(t.sub||'其他'),cat:String(t.cat||''),title:String(t.title||''),d:DT.test(t.d)?t.d:today(),due:DT.test(t.due)?t.due:'',
   g:t.g?1:0,full:+t.full>0?+t.full:100,note:t.note||'',r,t:+t.t||Date.now(),u:+t.u||Date.now()};
 });
}
let S=fixMeta({classes:[]}),TK={};
const U={};  // 每份雲端文件的同步狀態
const unit=k=>U[k]||(U[k]={t:0,last:'',dirty:false,busy:false,again:false,ref:null,unsub:null,pending:null});
const EMPTY='{"tasks":[]}';
const uKeys=()=>['m',...S.classes.map(c=>'c_'+c.id)];
const docName=k=>k==='m'?'school':'school_'+k;
const uData=k=>k==='m'?S:{tasks:TK[k.slice(2)]||[]};
function loadLocal(){
 try{const x=JSON.parse(localStorage.getItem('sch2-m'));S=fixMeta(JSON.parse(x.j));const u=unit('m');u.t=+x.t||0;u.last=JSON.stringify(S)}catch(e){S=fixMeta({classes:[]})}
 S.classes.forEach(c=>{const k='c_'+c.id,u=unit(k);try{const x=JSON.parse(localStorage.getItem('sch2-'+k));TK[c.id]=fixTasks(JSON.parse(x.j).tasks);u.t=+x.t||0;u.last=JSON.stringify(uData(k))}catch(e){TK[c.id]=[]}});
}
const saveLocal=k=>{try{localStorage.setItem('sch2-'+k,JSON.stringify({j:U[k].last,t:U[k].t}))}catch(e){status('⚠︎ 手機的空間不夠，請盡快同步')}};
loadLocal();
let TAB='today',CID='',BD=today(),SF='全部',TF={sub:'全部',open:0};
let GF={sub:'全部',from:semStart(),to:today()};
try{TAB=localStorage.getItem('sch-tab')||'today';CID=localStorage.getItem('sch-cls')||''}catch(e){}
if(!['today','stu','task','grade'].includes(TAB))TAB='today';

const cls=()=>S.classes.find(c=>c.id===CID)||S.classes[0]||null;
const stus=c=>(c?c.stus:[]).slice().sort((a,b)=>(a.no===''?1e9:a.no)-(b.no===''?1e9:b.no)||a.name.localeCompare(b.name,'zh-Hant'));
const tasks=()=>{const c=cls();return c?(TK[c.id]||(TK[c.id]=[])):[]};
const task=id=>tasks().find(t=>t.id===id);
const stu=id=>(cls()||{stus:[]}).stus.find(s=>s.id===id);
const sLabel=s=>s?(s.no!==''?s.no+' ':'')+s.name:'?';
const tName=t=>(t.cat||t.sub)+(t.title?' '+t.title:'');
const tDate=t=>t.due||t.d;
const R=(t,sid)=>t.r[sid]||{};
// 每個人這份作業的狀態
function stOf(t,sid){
 const r=R(t,sid);
 if(r.s===2)return 'x';
 if(r.s===1)return t.due&&r.a&&r.a>t.due?'late':'ok';
 if(!t.due)return 'no';
 return t.due<today()?'over':t.due===today()?'due':'no';
}
const ST_TXT={ok:'已交',late:'遲交',over:'逾期未交',due:'今天要交',no:'未交',x:'免交'};
const ST_CLS={ok:'ok',late:'late',over:'miss',due:'miss',no:'',x:'x'};
const TAG_CLS={ok:'ok',late:'warn',over:'bad',due:'bad',no:'g',x:'g'};
const isIn=r=>r.s===1||r.s===2;
// 到了這天還沒交（d 預設今天）
const missing=(t,sid,d)=>!isIn(R(t,sid))&&!!t.due&&t.due<=(d||today());
const fixing=(t,sid)=>R(t,sid).f===1;
function setR(t,sid,p){
 const r=fixRec({...R(t,sid),...p});
 if(Object.keys(r).length)t.r[sid]=r;else delete t.r[sid];
 t.u=Date.now();
}
// 某個學生還沒完成的：到期沒交、還沒訂正
function owes(sid,d){
 return tasks().filter(t=>missing(t,sid,d)||fixing(t,sid)).sort((a,b)=>tDate(a)<tDate(b)?-1:tDate(a)>tDate(b)?1:0).map(t=>({t,miss:missing(t,sid,d),fix:fixing(t,sid)}));
}
function tStats(t,ss){
 const o={n:ss.length,inn:0,late:0,miss:[],fix:[],fixed:0,sc:[]};
 ss.forEach(s=>{const r=R(t,s.id),k=stOf(t,s.id);
  if(k==='ok'||k==='late'||k==='x')o.inn++;if(k==='late')o.late++;
  if(!isIn(r))o.miss.push(s);if(r.f===1)o.fix.push(s);if(r.f===2)o.fixed++;
  if(r.c!==undefined)o.sc.push(r.c);});
 o.avg=o.sc.length?o.sc.reduce((a,b)=>a+b,0)/o.sc.length:null;
 return o;
}

// ---------- 儲存：先存手機，再同步到共用空間（一起管理的人改了會即時更新）----------
const CL={F:null,fam:null,fams:[],tm:0,st:'',none:false};
const me=()=>CL.F?CL.F.email:'';
function status(t){
 CL.st=t;const s=$('st');if(!s)return;const c=cls();
 s.textContent=(CL.fam?CL.fam.name+' · ':'')+(c?c.name+' '+c.stus.length+' 人 · ':'')+t;
}
const synced=()=>!Object.values(U).some(x=>x.dirty||x.busy);
function commit(){
 const now=Date.now();let any=false;
 uKeys().forEach(k=>{const u=unit(k),j=JSON.stringify(uData(k));if(j!==u.last){u.last=j;u.t=now;u.dirty=true;any=true;saveLocal(k)}});
 // 刪掉的班級：雲端那份清空
 Object.keys(U).forEach(k=>{if(k!=='m'&&!uKeys().includes(k)&&U[k].last!==EMPTY){U[k].last=EMPTY;U[k].t=now;U[k].dirty=true;any=true;try{localStorage.removeItem('sch2-'+k)}catch(e){}}});
 watchAll();render();
 if(any){status('同步中…');clearTimeout(CL.tm);CL.tm=setTimeout(pushAll,700)}
}
function pushAll(){Object.keys(U).forEach(k=>{if(U[k].dirty)push(k)})}
async function push(k){
 const u=unit(k);
 if(!u.ref){status(CL.st.startsWith('⚠︎')?CL.st:'⚠︎ 沒有連到雲端，資料只存在這支手機');return}
 if(u.busy){u.again=true;return}
 if(u.last.length>950000){status('⚠︎ 這個班級的資料太多了，請到「⋯ 設定」整理舊的作業');return}
 u.busy=true;u.dirty=false;
 try{await u.ref.set({j:u.last,t:u.t,by:me()});u.busy=false;if(synced())status('✓ 已同步')}
 catch(e){u.dirty=true;u.busy=false;status('⚠︎ 還沒同步，變更先存在這支手機，連上網路會再試')}
 if(u.again){u.again=false;push(k)}
}
// 正在打字、或是在填表單（出作業）：先不要更新畫面，等一下再套用
const editing=()=>{const a=document.activeElement;return $('sheet').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
const blocked=()=>STK.length&&(!STK[STK.length-1].live||editing());
function onCloud(k,d){
 const u=unit(k);
 if(!d){if(u.last&&u.last!==EMPTY){if(!u.t)u.t=Date.now();u.dirty=true;push(k)}else if(synced())status('✓ 已同步');return}
 const ct=+d.t||0;
 if(ct>u.t){
  if(u.dirty||u.busy)return;
  if(blocked()){u.pending=d;return}
  let o;try{o=JSON.parse(d.j)}catch(e){return}
  try{if(k==='m')S=fixMeta(o);else TK[k.slice(2)]=fixTasks(o.tasks)}catch(e){return}
  u.t=ct;u.last=JSON.stringify(uData(k));saveLocal(k);
  S.classes.forEach(c=>{if(!TK[c.id])TK[c.id]=[]});
  if(k==='m')watchAll();
  render();rs();
  if(d.by&&d.by!==me())toast(who(d.by)+' 剛剛更新了資料');
 }else if(ct<u.t&&!u.busy){u.dirty=true;push(k)}
 if(synced())status('✓ 已同步');
}
function applyPending(){if(blocked())return;Object.keys(U).forEach(k=>{const d=U[k].pending;if(d){U[k].pending=null;onCloud(k,d)}})}
function watchAll(){
 if(!CL.fam)return;
 uKeys().forEach(k=>{const u=unit(k);if(u.unsub)return;u.ref=CL.F.doc(CL.fam.id,docName(k));u.unsub=u.ref.watch(d=>onCloud(k,d),()=>status('⚠︎ 無法連線，先顯示這支手機上的資料'))});
}
function useFam(f){
 let prev='';try{prev=localStorage.getItem('sch-fid')||''}catch(e){}
 if(prev&&prev!==f.id){  // 換到別的空間：以那邊的資料為準
  Object.values(U).forEach(u=>u.unsub&&u.unsub());Object.keys(U).forEach(k=>delete U[k]);
  try{Object.keys(localStorage).filter(k=>k.startsWith('sch2-')).forEach(k=>localStorage.removeItem(k))}catch(e){}
  S=fixMeta({classes:[]});TK={};CID='';
 }
 try{localStorage.setItem('sch-fid',f.id);localStorage.setItem('mgl-school','1')}catch(e){}
 if(!CL.fams.some(x=>x.id===f.id))CL.fams.push(f);
 CL.fam=f;CL.none=false;
 status('連線中…');render();watchAll();
}
async function cloudInit(){
 try{
  const F=CL.F=await claude.use('family');
  if(!F)return status('⚠︎ 沒有連到雲端（請重新登入），資料只存在這支手機');
  try{CL.fams=(await F.list()).filter(x=>x.kind==='school')}catch(e){return status(e&&e.code==='permission-denied'?'⚠︎ 共用空間還沒開通（Firebase 要加上規則），資料先存在這支手機':'⚠︎ 無法連線，先顯示這支手機上的資料')}
  let pick='';try{pick=localStorage.getItem('sch-fid')||''}catch(e){}
  let f=CL.fams.find(x=>x.id===pick)||CL.fams.slice().sort((a,b)=>b.members.length-a.members.length)[0];
  // 管理員第一次打開會自動建立；其他人可以等被邀請，或自己建立一個
  if(!f&&window.FBU&&FBU.admin)f=await F.create('作業與成績',{kind:'school'});
  if(!f){CL.none=true;try{localStorage.removeItem('mgl-school')}catch(e){}status('還沒加入');return render()}
  useFam(f);
 }catch(e){status('⚠︎ 沒有連到雲端，資料只存在這支手機')}
}

 const rows=ss.map(s=>{const v=ts.map(t=>R(t,s.id).c),ps=ts.map((t,i)=>v[i]===undefined?null:v[i]/t.full*100).filter(x=>x!=null);return {s,v,avg:ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null}});

// ---------- 彈出視窗（可以一層一層點進去，‹ 返回 回到上一層）----------
const STK=[];
function openS(fn,live){STK.push({fn,live:!!live});try{history.pushState({lv:STK.length},'')}catch(e){}fn()}
function sheet(html,bind){
 const s=$('sheet');
 s.innerHTML=`<div class="bk"></div><div class="pn"><div class="back"><button data-back>‹ ${STK.length>1?'返回':'關閉'}</button></div>${html}</div>`;s.classList.add('on');
 s.querySelector('.bk').onclick=closeAll;
 s.querySelector('[data-back]').onclick=back;
 s.querySelectorAll('[data-x]').forEach(b=>b.onclick=back);
 if(bind)bind(s.querySelector('.pn'));
}
function after(){
 if(STK.length)refresh(STK[STK.length-1].fn);
 else{const s=$('sheet');s.classList.remove('on');s.innerHTML=''}
 applyPending();
}
function back(){if(history.state&&history.state.lv)history.back();else{STK.pop();after()}}
function closeAll(){const n=history.state&&history.state.lv||0;if(n)history.go(-n);else{STK.length=0;after()}}
addEventListener('popstate',e=>{const lv=e.state&&e.state.lv||0;if(STK.length<=lv)return;STK.length=lv;after()});
$('sheet').addEventListener('focusout',()=>setTimeout(applyPending,400));
const enter=(el,fn)=>{if(el)el.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();fn()}}};
// 保持捲動位置重新畫
function refresh(fn){const pn=document.querySelector('#sheet .pn'),y=pn?pn.scrollTop:0;fn();const p2=document.querySelector('#sheet .pn');if(p2)p2.scrollTop=y}
const rs=()=>{if(STK.length&&STK[STK.length-1].live)refresh(STK[STK.length-1].fn)};
const setTop=fn=>{STK[STK.length-1].fn=fn;refresh(fn)};

    <div class="bd"><div class="row sp" style="flex-wrap:nowrap;align-items:baseline"><b>${E(tName(t))}</b>${r.c!==undefined?`<b class="${scCls(pc)}" style="font-weight:700">${r.c}${t.full!==100?'/'+t.full:''}</b>`:''}</div>
    <div class="ln"><span class="tag g">${E(t.sub)}</span><span class="tag ${TAG_CLS[k]}">${ST_TXT[k]}${(k==='ok'||k==='late')&&r.a?' '+md(r.a):''}</span>${r.f===1?`<span class="tag warn">要訂正${r.p?'：'+E(r.p):''}</span>`:r.f===2?`<span class="tag ok">訂正完成${r.fa?' '+md(r.fa):''}${r.p?'（'+E(r.p)+'）':''}</span>`:''}${r.b?'<span class="tag">📒 已寫聯絡簿</span>':''}${r.n?' 📝 '+E(r.n):''}</div></div></div>`;

 let last={};try{last=JSON.parse(localStorage.getItem('sch-sub'))||{}}catch(e){}

function missText(){

 });

// ---------- 設定：班級、學生、科目、作業種類、一起管理、匯出 ----------
// 學生名單：一行一位，前面可以有座號（例如「3 王小明」、「3.王小明」、從 Excel 貼上的「3⇥王小明」）
function parseStus(text,c){
 let next=Math.max(0,...c.stus.map(s=>+s.no||0))+1;const out=[];
 String(text||'').split(/\r?\n|，|,/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
  const m=line.match(/^(\d+)\s*[\.、．號:：\-\t ]\s*(.+)$/);
  let no,name;if(m){no=+m[1];name=m[2].trim()}else{no=next;name=line}
  name=name.split(/\t/)[0].trim();if(!name)return;
  if(c.stus.some(s=>s.name===name)||out.some(s=>s.name===name))return;
  out.push({id:nid(),no,name});next=Math.max(next,no)+1;
 });
 return out;
}
function mkClass(name,text){
 name=String(name||'').trim();if(!name)return toast('請填班級名稱');
 if(S.classes.some(c=>c.name===name))return toast('已經有「'+name+'」了');
 const c={id:nid(),name,stus:[]};c.stus=parseStus(text,c);
 op(()=>{S.classes.push(c);TK[c.id]=[];CID=c.id;try{localStorage.setItem('sch-cls',c.id)}catch(e){}},'已建立「'+name+'」'+(c.stus.length?'，'+c.stus.length+' 位學生':''));
}

   };
  }
  const as=()=>{const v=p.querySelector('#ns').value.trim();if(!v||S.subs.includes(v))return;op(()=>S.subs.push(v));again()};
  p.querySelector('#nsb2').onclick=as;enter(p.querySelector('#ns'),as);
  p.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{const s=S.subs[+b.dataset.sd];op(()=>{S.subs=S.subs.filter(x=>x!==s)},'已移除科目「'+s+'」（原本的作業不會刪）');again()});
  p.querySelectorAll('[data-cks]').forEach(sel=>sel.onchange=()=>{op(()=>{S.cats[+sel.dataset.cks].s=sel.value})});
  p.querySelectorAll('[data-ckg]').forEach(b=>b.onclick=()=>{op(()=>{const k=S.cats[+b.dataset.ckg];k.g=k.g?0:1});again()});
  p.querySelectorAll('[data-ckd]').forEach(b=>b.onclick=()=>{const k=S.cats[+b.dataset.ckd];op(()=>{S.cats=S.cats.filter(x=>x!==k)},'已移除「'+k.n+'」（原本的作業不會刪）');again()});
  const ak=()=>{const v=p.querySelector('#nck').value.trim();if(!v)return;if(S.cats.some(k=>k.n===v))return toast('已經有「'+v+'」了');op(()=>S.cats.push({n:v,s:p.querySelector('#ncks').value,g:/考|測驗/.test(v)?1:0}));again()};
  p.querySelector('#nckb').onclick=ak;enter(p.querySelector('#nck'),ak);
  p.querySelector('#exp').onclick=()=>download('作業與成績-'+stamp()+'.json',JSON.stringify({v:2,meta:S,tasks:TK},null,1),'application/json');
  p.querySelector('#imp').onclick=()=>$('impf').click();
  const lo=p.querySelector('#lo');if(lo)lo.onclick=()=>window.fbLogout();
 });
}
$('impf').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 let m,tk={};
 try{const o=JSON.parse(await f.text());m=fixMeta(o.meta);m.classes.forEach(c=>tk[c.id]=fixTasks((o.tasks||{})[c.id]))}catch(x){return alert('這不是「作業與成績」的備份檔。')}
 if(!confirm('用備份檔取代現在的資料？（'+m.classes.length+' 個班級；還原後可以按「復原」）'))return;
 op(()=>{S=m;TK=tk},'已從備份還原');closeAll();
};

// ---------- 點擊 ----------
function onClick(e){
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,ds=b.dataset;
 if(b.tagName==='A')e.preventDefault();
 if(a==='tab'){TAB=ds.k;$('q').value='';try{localStorage.setItem('sch-tab',TAB)}catch(x){}return render()}
 if(a==='cls'){CID=ds.k;try{localStorage.setItem('sch-cls',CID)}catch(x){}return render()}
 if(a==='addcls')return openS(setSheet);
 if(a==='sf'){SF=ds.v;return render()}
 if(a==='tf'){TF.sub=ds.v;return render()}
 if(a==='topen'){TF.open=TF.open?0:1;return render()}
 if(a==='bd'){BD=ds.v==='0'?today():addD(BD,+ds.v);return render()}
 if(a==='gr'){const t=today(),d=pd(t);GF.to=t;
  if(ds.v==='sem')GF.from=semStart();else if(ds.v==='mon')GF.from=t.slice(0,8)+'01';
  else if(ds.v==='m1'){GF.from=ymd(new Date(d.getFullYear(),d.getMonth()-1,1));GF.to=ymd(new Date(d.getFullYear(),d.getMonth(),0))}
  else GF.from='2000-01-01';return render()}
 if(a==='gcsv')return gradeCSV();
 if(a==='hcsv')return hwCSV();
 if(a==='new')return openS(()=>taskEdit(null,ds.due?{due:ds.due}:null));
 if(a==='set')return openS(setSheet);
 if(a==='mkcls')return mkClass($('ncn').value,$('ncs').value);
 if(a==='mkfam'){b.disabled=true;CL.F.create('作業與成績',{kind:'school'}).then(useFam).catch(()=>{b.disabled=false;alert('沒有成功，請確認網路後再試。')});return}
 if(a==='stu')return openS(()=>stuSheet(ds.s),true);
 if(a==='task')return openS(()=>taskSheet(ds.id),true);
 if(a==='rec')return openS(()=>recSheet(ds.t,ds.s));
 if(a==='remind')return openS(()=>textSheet('聯絡簿提醒',remindText(ds.s)));
 if(a==='misscopy')return openS(()=>textSheet('還沒完成的名單',missText()));
 const t=ds.t&&task(ds.t),s=ds.s&&stu(ds.s);
 if(a==='allin'&&t){allIn(t.id,ds.d||today());return rs()}
 if(!t||!s)return;
 const d=ds.d||today();
 if(a==='tog'){const r=R(t,s.id);op(()=>setR(t,s.id,isIn(r)?{s:0}:{s:1,a:d}),isIn(r)?sLabel(s)+' 改成沒交':null);return rs()}
 if(a==='in'){op(()=>setR(t,s.id,{s:1,a:d}),sLabel(s)+' '+tName(t)+' 補交了');return rs()}
 if(a==='fixed'){op(()=>setR(t,s.id,{f:2,fa:today()}),sLabel(s)+' '+tName(t)+' 訂正好了');return rs()}
 if(a==='cb'){op(()=>setR(t,s.id,{b:R(t,s.id).b?0:1}));return rs()}
}

shell();
$('app').addEventListener('click',onClick);
$('sheet').addEventListener('click',onClick);
$('app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=button]'))onClick(e)});
render();
cloudInit();
</script>
</body>
