<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Good Life">
<link rel="manifest" href="home.webmanifest">
<link rel="icon" href="home.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="home-180.png">
<title>Mei Good Life</title>
<style>
:root{--bg:#F4F1EC;--card:#fff;--ink:#2B2A27;--sub:#7A766E;--line:#E4DFD6;--acc:#5E7A6A;
 --t6:#F6E6D8;--i6:#A85A30;--t1:#E1E7EF;--i1:#4F6F8C;--t2:#E3E9DF;--i2:#5E7A6A;--t3:#F3E2E1;--i3:#A8625F;--t4:#F0E7DA;--i4:#9A7440;--t5:#E9E3F0;--i5:#76619A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#22211E;--ink:#EDEAE4;--sub:#A29D94;--line:#34322E;--acc:#9DC0AC;
 --t1:#29303A;--i1:#8DB0D0;--t2:#2C3329;--i2:#9DC0AC;--t3:#3A2B2A;--i3:#E0A09C;--t4:#36301F;--i4:#D9B47A;--t5:#322C3A;--i5:#B9A5DA;--t6:#3A2C22;--i6:#E8A57C}}
:root[data-theme="dark"]{--bg:#171614;--card:#22211E;--ink:#EDEAE4;--sub:#A29D94;--line:#34322E;--acc:#9DC0AC;
 --t1:#29303A;--i1:#8DB0D0;--t2:#2C3329;--i2:#9DC0AC;--t3:#3A2B2A;--i3:#E0A09C;--t4:#36301F;--i4:#D9B47A;--t5:#322C3A;--i5:#B9A5DA;--t6:#3A2C22;--i6:#E8A57C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC",-apple-system,"Microsoft JhengHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 16px 40px}
.hi{font-size:14px;color:var(--sub);margin:0}
h1{font-size:28px;margin:2px 0 22px;font-weight:700;letter-spacing:.5px}
h2{font-size:14px;color:var(--sub);font-weight:500;margin:24px 2px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile[hidden]{display:none}
.tile{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;min-height:150px;transition:transform .12s}
a.tile:active{transform:scale(.97)}
.ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--t)}
.ic svg{width:26px;height:26px;stroke:var(--i);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:18px;display:block;font-weight:400;letter-spacing:.06em}
.tile p{margin:2px 0 0;font-size:13px;color:var(--sub);line-height:1.45}
.tag{margin-top:auto;align-self:flex-start;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--t);color:var(--i)}
.soon{opacity:.6}
.soon .tag{background:none;border:1px dashed var(--line);color:var(--sub)}
.k1{--t:var(--t1);--i:var(--i1)}.k2{--t:var(--t2);--i:var(--i2)}.k3{--t:var(--t3);--i:var(--i3)}.k4{--t:var(--t4);--i:var(--i4)}.k5{--t:var(--t5);--i:var(--i5)}.k6{--t:var(--t6);--i:var(--i6)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lk{display:flex;align-items:center;gap:5px;margin-top:2px;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:999px;padding:6px 13px 6px 10px;font:inherit;font-size:13px;cursor:pointer}
.lk svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile{position:relative}
.cp{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--sub);display:grid;place-items:center;padding:0;cursor:pointer}
.cp svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cp.ok{color:var(--acc);border-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;z-index:20}
#toast.on{opacity:.92}
footer{text-align:center;font-size:11px;color:var(--sub);margin-top:36px;opacity:.8}
</style>
<link rel="stylesheet" href="look.css">
<script src="look.js"></script>
</head>
<body>
<main>
<div class="hd"><div><p class="hi" id="hi">今天</p>
<h1>Mei Good Life</h1></div><button class="lk" onclick="MGL_LOOK.open()" aria-label="換風格"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.7 1.7-1.7H16a5 5 0 0 0 5-5C21 6.3 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.3" r="1"/><circle cx="14.5" cy="7.3" r="1"/></svg>風格</button></div>

<div class="grid">
 <a class="tile k1" id="money" href="money.html" hidden>
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></svg></div>
  <div><b>記帳</b><p>收支、預算、股票、代墊</p></div>
  <span class="tag">私人</span>
 </a>
 <a class="tile k5" id="cal" href="cal.html" hidden>
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r=".9"/><circle cx="12" cy="14.5" r=".9"/><circle cx="15.5" cy="14.5" r=".9"/></svg></div>
  <div><b>行事曆</b><p>課表、跟進、生日、保固</p></div>
  <span class="tag">私人</span>
 </a>
 <a class="tile k4" id="trip" href="trip.html" hidden>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/></svg></div>
  <div><b>旅遊行程</b><p>每天的行程、準備清單、跟記帳連動</p></div>
  <span class="tag">私人</span>
 </a>
 <a class="tile k3" id="roster" href="https://mei0829.github.io/Uultra/" hidden>
  <div class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 11l2 2 4-4"/></svg></div>
  <div><b>新人名單</b><p>新人資訊、跟進、課表、組織</p></div>
  <span class="tag">私人</span>
 </a>
 <a class="tile k3" id="bloom" href="blooming/" hidden>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21V10"/><path d="M12 15c-2.5-.4-4.4-2.2-4.8-5 2.8.2 4.5 2 4.8 5zM12 13c2.5-.4 4.4-2.2 4.8-5-2.8.2-4.5 2-4.8 5z"/><circle cx="12" cy="7" r="2.3"/></svg></div>
  <div><b>幸孕女子</b><p>備孕、孕期紀錄、產檢、花費與保險</p></div>
  <span class="tag">私人</span>
 </a>
 <a class="tile k2" href="cabinet.html">
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 9h14M5 15h14M11 6h2M11 12h2M11 18h2"/></svg></div>
  <div><b>物品存放</b><p>哪個櫃子哪一格放了什麼</p></div>
  <span class="tag">家人共用</span>
 </a>
 <a class="tile k6" id="biz" href="biz.html" hidden>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 0 1 16 0z"/><path d="M3 15h18"/><path d="M9 11.5h.01M12 10h.01M15 11.5h.01"/></svg></div>
  <div><b>東京餅創業</b><p>原物料價格、新點子、口味筆記</p></div>
  <span class="tag">夥伴共用</span>
 </a>
</div>

<h2>規劃中</h2>
<div class="grid">
 <div class="tile k3 soon">
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M9 3 4 6l2 4 2-1v12h8V9l2 1 2-4-5-3a3 3 0 0 1-6 0z"/></svg></div>
  <div><b>衣服穿搭</b><p>衣櫃清單、搭配紀錄</p></div>
  <span class="tag">私人</span>
 </div>
</div>

<footer>© 2026 mei0829 版權所有</footer>
</main>
<script>
// 記帳只在管理員登入過的手機上顯示
try{if(localStorage.getItem('mgl-role')==='admin'){document.getElementById('money').hidden=false;document.getElementById('cal').hidden=false;document.getElementById('roster').hidden=false;document.getElementById('bloom').hidden=false;document.getElementById('trip').hidden=false}}catch(e){}
// 創業頁只給管理員和被邀請的夥伴看到
try{if(localStorage.getItem('mgl-role')==='admin'||localStorage.getItem('mgl-biz')==='1')document.getElementById('biz').hidden=false}catch(e){}
// 每張卡片右上角的「複製連結」：貼到 Safari 打開，就能用「加入主畫面」
const ICON='<svg viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>';
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function toast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();return ok}}
document.querySelectorAll('a.tile').forEach(t=>{
 const b=document.createElement('button');b.type='button';b.className='cp';b.innerHTML=ICON;
 const name=t.querySelector('b').textContent;b.setAttribute('aria-label','複製「'+name+'」的連結');
 b.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();
  if(await copy(t.href)){b.classList.add('ok');b.innerHTML=CHECK;toast('已複製「'+name+'」的連結，貼到 Safari 網址列');setTimeout(()=>{b.classList.remove('ok');b.innerHTML=ICON},1800)}
  else prompt('複製這個連結：',t.href)});
 t.appendChild(b)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const d=new Date(),h=d.getHours();
document.getElementById('hi').textContent=(h<11?'早安':h<18?'午安':'晚安')+'・'+(d.getMonth()+1)+'/'+d.getDate()+'（'+'日一二三四五六'[d.getDay()]+'）';
</script>
</body>
</html>
