<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Good Life">
<link rel="manifest" href="home.webmanifest">
<link rel="icon" href="home.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="home.svg">
<title>Mei Good Life</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F1EC;--card:#fff;--ink:#2B2A27;--sub:#7A766E;--line:#E4DFD6;--acc:#5E7A6A;
 --t6:#F6E6D8;--i6:#A85A30;--t1:#E1E7EF;--i1:#4F6F8C;--t2:#E3E9DF;--i2:#5E7A6A;--t3:#F3E2E1;--i3:#A8625F;--t4:#F0E7DA;--i4:#9A7440;--t5:#E9E3F0;--i5:#76619A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#22211E;--ink:#EDEAE4;--sub:#A29D94;--line:#34322E;--acc:#9DC0AC;
 --t1:#29303A;--i1:#8DB0D0;--t2:#2C3329;--i2:#9DC0AC;--t3:#3A2B2A;--i3:#E0A09C;--t4:#36301F;--i4:#D9B47A;--t5:#322C3A;--i5:#B9A5DA;--t6:#3A2C22;--i6:#E8A57C}}
:root[data-theme="dark"]{--bg:#171614;--card:#22211E;--ink:#EDEAE4;--sub:#A29D94;--line:#34322E;--acc:#9DC0AC;
 --t1:#29303A;--i1:#8DB0D0;--t2:#2C3329;--i2:#9DC0AC;--t3:#3A2B2A;--i3:#E0A09C;--t4:#36301F;--i4:#D9B47A;--t5:#322C3A;--i5:#B9A5DA;--t6:#3A2C22;--i6:#E8A57C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC",-apple-system,"Microsoft JhengHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 16px 40px}
.hi{font-size:14px;color:var(--sub);margin:0}
h1{font-size:28px;margin:2px 0 22px;font-weight:700;letter-spacing:.5px}
h2{font-size:14px;color:var(--sub);font-weight:500;margin:24px 2px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile[hidden]{display:none}
.tile{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;min-height:150px;transition:transform .12s}
a.tile:active{transform:scale(.97)}
.ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--t)}
.ic svg{width:26px;height:26px;stroke:var(--i);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:17px;display:block}
.tile p{margin:2px 0 0;font-size:13px;color:var(--sub);line-height:1.45}
.tag{margin-top:auto;align-self:flex-start;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--t);color:var(--i)}
.soon{opacity:.6}
.soon .tag{background:none;border:1px dashed var(--line);color:var(--sub)}
.k1{--t:var(--t1);--i:var(--i1)}.k2{--t:var(--t2);--i:var(--i2)}.k3{--t:var(--t3);--i:var(--i3)}.k4{--t:var(--t4);--i:var(--i4)}.k5{--t:var(--t5);--i:var(--i5)}.k6{--t:var(--t6);--i:var(--i6)}
footer{text-align:center;font-size:11px;color:var(--sub);margin-top:36px;opacity:.8}
</style>
</head>
<body>
<main>
<p class="hi" id="hi">今天</p>
<h1>Mei Good Life</h1>

<div class="grid">
 <a class="tile k1" id="money" href="money.html" hidden>
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></svg></div>
  <div><b>記帳</b><p>收支、預算、股票、代墊</p></div>
  <span class="tag">私人</span>
 </a>
 <a class="tile k5" id="cal" href="cal.html" hidden>
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r=".9"/><circle cx="12" cy="14.5" r=".9"/><circle cx="15.5" cy="14.5" r=".9"/></svg></div>
  <div><b>行事曆</b><p>課表、跟進、生日、保固</p></div>
  <span class="tag">私人</span>
 </a>
 <a class="tile k3" id="roster" href="https://mei0829.github.io/Uultra/" hidden>
  <div class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 11l2 2 4-4"/></svg></div>
  <div><b>新人名單</b><p>新人資訊、跟進、課表、組織</p></div>
  <span class="tag">私人</span>
 </a>
 <a class="tile k2" href="cabinet.html">
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 9h14M5 15h14M11 6h2M11 12h2M11 18h2"/></svg></div>
  <div><b>物品存放</b><p>哪個櫃子哪一格放了什麼</p></div>
  <span class="tag">家人共用</span>
 </a>
 <a class="tile k6" id="biz" href="biz.html" hidden>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 0 1 16 0z"/><path d="M3 15h18"/><path d="M9 11.5h.01M12 10h.01M15 11.5h.01"/></svg></div>
  <div><b>東京餅創業</b><p>原物料價格、新點子、口味筆記</p></div>
  <span class="tag">夥伴共用</span>
 </a>
</div>

<h2>規劃中</h2>
<div class="grid">
 <div class="tile k3 soon">
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M9 3 4 6l2 4 2-1v12h8V9l2 1 2-4-5-3a3 3 0 0 1-6 0z"/></svg></div>
  <div><b>衣服穿搭</b><p>衣櫃清單、搭配紀錄</p></div>
  <span class="tag">私人</span>
 </div>
 <div class="tile k4 soon">
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/></svg></div>
  <div><b>旅遊紀錄</b><p>去過的地方、行程、照片</p></div>
  <span class="tag">家人共用</span>
 </div>
</div>

<footer>© 2026 mei0829 版權所有</footer>
</main>
<script>
// 記帳只在管理員登入過的手機上顯示
try{if(localStorage.getItem('mgl-role')==='admin'){document.getElementById('money').hidden=false;document.getElementById('cal').hidden=false;document.getElementById('roster').hidden=false}}catch(e){}
// 創業頁只給管理員和被邀請的夥伴看到
try{if(localStorage.getItem('mgl-role')==='admin'||localStorage.getItem('mgl-biz')==='1')document.getElementById('biz').hidden=false}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const d=new Date(),h=d.getHours();
document.getElementById('hi').textContent=(h<11?'早安':h<18?'午安':'晚安')+'・'+(d.getMonth()+1)+'/'+d.getDate()+'（'+'日一二三四五六'[d.getDay()]+'）';
</script>
</body>
</html>
